<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220" role="img" aria-labelledby="t d"><title id="t">Where a try's time goes</title><desc id="d">Median try cycle 69 s: arm motion 37.5 s, Astra planning 26.8 s, the rest 4.7 s.</desc><style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}</style><rect width="100%" height="100%" rx="12" fill="#1a1a19"/><text x="24" y="34" font-size="17" fill="#f0efec" text-anchor="start" font-weight="600">Where a try's 69 s goes</text><text x="24" y="56" font-size="12.5" fill="#c3c2b7" text-anchor="start" font-weight="400">Medians over the session. The arm, not the model, is most of the time.</text><rect x="24" y="104" width="385.1" height="28" rx="4" fill="#9085e9"/><text x="32" y="123" font-size="12" fill="#ffffff" text-anchor="start" font-weight="600">38 s</text><rect x="411.1" y="104" width="274.2" height="28" rx="4" fill="#d55181"/><text x="419.1" y="123" font-size="12" fill="#ffffff" text-anchor="start" font-weight="600">27 s</text><rect x="687.3" y="104" width="48.7" height="28" rx="4" fill="#2c2c2a"/><text x="695.3" y="123" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="600">5 s</text><rect x="24" y="156" width="10" height="10" rx="2" fill="#9085e9"/><text x="40" y="165" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">arm motion</text><rect x="128" y="156" width="10" height="10" rx="2" fill="#d55181"/><text x="144" y="165" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">Astra planning</text><rect x="258.4" y="156" width="10" height="10" rx="2" fill="#2c2c2a"/><text x="274.4" y="165" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">camera, SSH and saving</text></svg>
