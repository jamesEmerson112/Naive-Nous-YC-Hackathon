# setup.sh applies these keys to ~/.hermes/profiles/manager/config.yaml (the file `hermes profile create manager
# --clone` copied from the default profile) with `hermes -p manager config set`, one key each; config_pairs.py
# reads this file, so keep it to nested maps, plain scalars and one-line lists (no quotes). The cloned `model:`
# block stays: it is the ChatGPT-plan login (openai-codex) with gpt-6-sol at default reasoning, the same as the
# default profile (docs/pi-vs-hermes.md:12, 16).
# H:L<n> = a line in docs/raw/hermes-llms-full.txt. Design: docs/worker-manager-healer.md §2.1.

delegation:
  max_concurrent_children: 3     # set explicitly: the docs say 10 (H:L19187) and 3 (H:L7001)
  max_spawn_depth: 1             # flat: children can't delegate (H:L7004)
  max_iterations: 8              # per child; default 250 (H:L19907, example at H:L19537)
  child_timeout_seconds: 60      # default 0 = none, floor 30 (H:L19552-19553)
  # NEW, not in the design's §2.1: join the children inside the run's own turn. Under the default `auto`,
  # "the API server ... keep[s] background delegation" (H:L19782-19786), and a background delegation ends
  # the parent's turn with a one-line status (H:L19771-19773): the run's output would be "working on it",
  # not the fix plan. `inline`: "every gateway session joins its children inside the turn" (H:L19787).
  # (inferred: that API-server runs count as gateway sessions here. If a run still answers with a status
  # line, the worker refuses it and falls back; see README "If the run answers 'working on it'".)
  gateway_mode: inline
  # No base_url/model: children use the parent's gpt-6-sol (inferred: no per-token cost on the ChatGPT plan).
agent:
  # "remains authoritative" (H:L20395), applied after per-platform config (H:L4829-4840). --clone copies the
  # default profile's plugins too (H:L9028), so so101_arm would otherwise be on (H:L16354-16357).
  # The API server's default keeps everything but clarify, tts, computer_use and kanban (H:L56075-56077), so
  # every other default toolset is named here: the worker refuses to ask a manager with anything on but
  # delegation, memory and skills (armsim/manager.py toolset_problems). Removal is per tool (H:L4844-4845):
  # never list a composite here (coding, safe, debugging), it would strip delegate_task, memory or the skill tools.
  # so101_arm and mcp-naive_board stay here even with platform_toolsets below: enabled plugin toolsets are
  # still added to an explicit list (H:L38901-38903, H:L38626-38627).
  disabled_toolsets: [terminal, code_execution, file, browser, web, vision, image_gen, todo, cronjob, session_search, so101_arm, mcp-naive_board]
  # web: added to the design's list (inferred: the analysts read only the packet). Add `memory` too if
  # incidents start leaking into each other through the profile's memory (H:L4833-4834, H:L14365).
platform_toolsets:
  # The API server's own list, written out (replaces the hermes-api-server default, as Blank Slate does for the
  # CLI so nothing new loads after `hermes update`, H:L396; the per-platform key H:L20390, its name H:L102983).
  # no_mcp keeps the default profile's MCP servers out (H:L38630-38632, H:L38947: inferred that the api_server
  # list reads it as ACP's does; an unknown name is dropped, H:L35035, and then check.sh names any MCP toolset).
  api_server: [delegation, memory, skills, no_mcp]
skills:
  # The skills toolset is on so the manager can read arm-incident-manager (skill_view, H:L12660-12664), and it
  # brings skill_manage (H:L56060): stage every skill write for a person instead (H:L13153-13170; inferred
  # that this covers API-server runs). setup.sh also locks the skill (`curator lock`, H:L13186-13190).
  write_approval: true
approvals:
  unattended_mode: deny          # the defaults (H:L10764-10783), written down so a clone can't change them
  single_query_mode: deny
gateway:
  api_server:
    max_concurrent_runs: 2       # default 10, then HTTP 429 (H:L39899, H:L39907); there is one arm
kanban:
  auto_decompose: false          # otherwise an extra LLM call every tick (H:L20749)
