<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Romulus Mission Control</title>
<!--
  Romulus Mission Control: the demo screen, served by armsim/mission.py (python -m armsim.mission).
  One file, no network: inline CSS and JS, system fonts. It polls /api/arm (~10 Hz, the 3D twin)
  and /api/state (~1 Hz, everything else), and posts the presenter's buttons to /api/*.
-->
<style>
:root {
  --bg: #04070e;
  --bg2: #081223;
  --panel: rgba(13, 22, 40, 0.62);
  --panel-hi: rgba(22, 36, 62, 0.55);
  --line: rgba(130, 175, 255, 0.16);
  --line-hi: rgba(150, 200, 255, 0.34);
  --text: #eaf1fb;
  --text-2: #b4c3da;
  --muted: #7d8ea9;
  --faint: #4f5f7a;
  --accent: #3ad1f7;
  --accent-rgb: 58, 209, 247;
  --ok: #33d69f;
  --ok-rgb: 51, 214, 159;
  --warn: #fbbf3a;
  --warn-rgb: 251, 191, 58;
  --bad: #ff4d63;
  --bad-rgb: 255, 77, 99;
  --idle: #9fb0c9;
  --idle-rgb: 159, 176, 201;
  --ice: #9fe6ff;
  --sans: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Inter Display", "Inter", ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  --text-font: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Inter", ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, "DejaVu Sans Mono", monospace;
  --r: 18px;
  --gap: clamp(10px, 0.75vw, 16px);
}
* { box-sizing: border-box; }
html { font-size: clamp(11.5px, calc(0.42vw + 0.6vh), 17px); }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--text-font);
  font-feature-settings: "tnum" 1, "cv11" 1;
  -webkit-font-smoothing: antialiased;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: var(--gap);
  padding: var(--gap) calc(var(--gap) * 1.3);
}
.bg {
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(1200px 700px at 18% -10%, rgba(var(--accent-rgb), 0.10), transparent 60%),
    radial-gradient(900px 600px at 100% 110%, rgba(90, 110, 255, 0.08), transparent 60%),
    radial-gradient(140% 120% at 50% 40%, transparent 55%, rgba(0, 0, 0, 0.65) 100%),
    linear-gradient(180deg, var(--bg2), var(--bg));
}
.bg::after {
  content: ""; position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(140, 180, 255, 0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(140, 180, 255, 0.045) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: radial-gradient(120% 90% at 50% 45%, #000 30%, transparent 85%);
}
body.alarm .bg { animation: alarmbg 2.4s ease-in-out infinite; }
@keyframes alarmbg { 50% { filter: brightness(1.18) saturate(1.2); } }

/* ---------- header ---------- */
header.top {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: center;
  gap: 1.5rem;
  min-height: 5.2rem;
}
.brand { display: flex; align-items: center; gap: 1rem; min-width: 0; }
.mark { width: 3.3rem; height: 3.3rem; flex: none; filter: drop-shadow(0 0 14px rgba(var(--accent-rgb), 0.45)); }
.name { font-family: var(--sans); font-size: 1.9rem; font-weight: 650; letter-spacing: -0.015em; line-height: 1.05; white-space: nowrap; }
.name b { font-weight: 650; background: linear-gradient(90deg, #fff, var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tag { margin-top: 0.3rem; font-size: 0.82rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); white-space: nowrap; display: flex; gap: 0.7rem; align-items: center; }
.chip { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.06em; padding: 0.18rem 0.5rem; border: 1px solid var(--line-hi); border-radius: 999px; color: var(--text-2); text-transform: uppercase; }

.pillwrap { display: flex; flex-direction: column; align-items: center; gap: 0.45rem; min-width: 0; }
.pill {
  --c: var(--idle-rgb);
  display: flex; align-items: center; gap: 0.9rem;
  padding: 0.65rem 1.9rem 0.65rem 1.4rem;
  border-radius: 999px;
  font-family: var(--sans);
  font-size: 2.35rem; font-weight: 760; letter-spacing: 0.05em;
  color: rgb(var(--c));
  background: linear-gradient(180deg, rgba(var(--c), 0.20), rgba(var(--c), 0.08));
  border: 1.5px solid rgba(var(--c), 0.55);
  box-shadow: 0 0 0 1px rgba(0,0,0,0.3) inset, 0 0 46px rgba(var(--c), 0.28), 0 0 120px rgba(var(--c), 0.10);
  transition: color .5s, background .5s, border-color .5s, box-shadow .5s;
  white-space: nowrap; max-width: 46vw; overflow: hidden;
}
.pill .word { color: #fff; text-shadow: 0 0 22px rgba(var(--c), 0.9); }
.pill .why { font-weight: 600; letter-spacing: 0.01em; color: rgb(var(--c)); overflow: hidden; text-overflow: ellipsis; }
.pill .dot { width: 0.85rem; height: 0.85rem; border-radius: 50%; background: rgb(var(--c)); box-shadow: 0 0 14px rgb(var(--c)); flex: none; animation: breathe 2.2s ease-in-out infinite; }
.pill.ok { --c: var(--ok-rgb); }
.pill.warn { --c: var(--warn-rgb); }
.pill.warn .dot { animation-duration: 0.9s; }
.pill.bad { --c: var(--bad-rgb); }
.pill.bad .dot { animation-duration: 0.7s; }
.pill.person { --c: var(--bad-rgb); background: linear-gradient(180deg, rgba(var(--c), 0.55), rgba(var(--c), 0.30)); }
.pill.person .why { color: #fff; }
.pill.off { --c: 120, 135, 160; }
.pill.off .dot { animation: none; }
@keyframes breathe { 50% { opacity: 0.35; transform: scale(0.8); } }
.pillsub { font-size: 0.98rem; color: var(--text-2); max-width: 44vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 1.2em; }

.hright { display: flex; align-items: center; justify-content: flex-end; gap: 1.2rem; min-width: 0; }
.clock { text-align: right; }
#clock { font-family: var(--sans); font-size: 2.05rem; font-weight: 600; letter-spacing: 0.01em; line-height: 1; }
#clock small { font-size: 0.55em; color: var(--muted); font-weight: 600; margin-left: 0.25em; }
.date { font-size: 0.78rem; color: var(--muted); letter-spacing: 0.14em; text-transform: uppercase; margin-top: 0.35rem; }
.fleetbox { display: flex; flex-direction: column; align-items: flex-start; gap: 0.25rem; padding-left: 1.2rem; border-left: 1px solid var(--line); }
.fleetbox .k { font-size: 0.72rem; letter-spacing: 0.2em; color: var(--muted); text-transform: uppercase; }
.fleetbox .v { font-family: var(--sans); font-size: 1.15rem; font-weight: 700; letter-spacing: 0.06em; display: flex; align-items: center; gap: 0.5rem; white-space: nowrap; }
.fleetbox .v .d { width: 0.6rem; height: 0.6rem; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; }
.fleetbox .v.live { color: var(--ok); }
.fleetbox .v.frozen { color: var(--ice); }
.fleetbox .v.unknown { color: var(--muted); }
button { font: inherit; color: inherit; cursor: pointer; }
.freeze {
  font-family: var(--sans); font-weight: 760; letter-spacing: 0.08em; font-size: 1.12rem;
  padding: 0.95rem 1.4rem; border-radius: 14px; white-space: nowrap;
  color: #fff; background: linear-gradient(180deg, rgba(var(--bad-rgb), 0.95), rgba(200, 30, 60, 0.95));
  border: 1px solid rgba(255, 170, 180, 0.6);
  box-shadow: 0 8px 30px rgba(var(--bad-rgb), 0.35), inset 0 1px 0 rgba(255,255,255,0.35);
  transition: transform .12s, filter .2s, background .3s;
}
.freeze:hover { filter: brightness(1.1); }
.freeze:active, .freeze.press { transform: scale(0.96); }
.freeze.unfreeze { background: linear-gradient(180deg, rgba(120, 220, 255, 0.95), rgba(40, 150, 220, 0.95)); color: #04121f; border-color: rgba(200, 245, 255, 0.8); box-shadow: 0 8px 30px rgba(120, 220, 255, 0.35), inset 0 1px 0 rgba(255,255,255,0.5); }
.freeze[disabled] { opacity: 0.4; filter: grayscale(0.8); cursor: default; }
.freeze kbd { margin-left: 0.6rem; }

/* ---------- panels ---------- */
main { display: grid; grid-template-columns: minmax(0, 1.52fr) minmax(0, 1fr); gap: var(--gap); min-height: 0; min-width: 0; }
.col { display: grid; gap: var(--gap); min-height: 0; min-width: 0; }
.col.left { grid-template-rows: minmax(0, 1fr) auto; }
.col.right { grid-template-rows: minmax(0, 1.05fr) minmax(0, 1fr) minmax(0, 0.82fr); }
@media (max-height: 920px) {
  .col.right { grid-template-rows: minmax(0, 1fr) minmax(0, 0.92fr) minmax(0, 1fr); }
  .phead { padding: 0.75rem 1.1rem 0.45rem; }
}
.duo { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: var(--gap); min-height: 0; }
.panel {
  position: relative; min-height: 0; min-width: 0;
  display: flex; flex-direction: column;
  border-radius: var(--r);
  background: linear-gradient(180deg, var(--panel-hi), var(--panel) 30%);
  border: 1px solid var(--line);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 20px 50px rgba(0,0,0,0.35);
  backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
  overflow: hidden;
  transition: border-color .5s, box-shadow .5s;
}
.panel::before {
  content: ""; position: absolute; left: 8%; right: 8%; top: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(var(--accent-rgb), 0.55), transparent);
  opacity: 0.7;
}
.phead { display: flex; align-items: baseline; gap: 0.8rem; padding: 0.95rem 1.2rem 0.6rem; flex: none; min-width: 0; }
.phead h2 { margin: 0; font-family: var(--sans); font-size: 0.86rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-2); white-space: nowrap; }
.phead .sub { font-size: 0.86rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.phead .spacer { flex: 1; }
.live { display: inline-flex; align-items: center; gap: 0.45rem; font-size: 0.76rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.live i { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--ok); box-shadow: 0 0 10px var(--ok); animation: breathe 1.6s ease-in-out infinite; }
.live.dead i { background: var(--faint); box-shadow: none; animation: none; }
.empty-state { margin: auto; text-align: center; color: var(--muted); font-size: 1rem; line-height: 1.5; padding: 1rem; }
.empty-state b { display: block; color: var(--text-2); font-weight: 600; font-size: 1.08rem; margin-bottom: 0.2rem; }
.empty-state code { font-family: var(--mono); font-size: 0.85em; color: var(--text-2); background: rgba(255,255,255,0.05); padding: 0.1rem 0.4rem; border-radius: 6px; }

/* ---------- twin ---------- */
.twin.alarm { border-color: rgba(var(--bad-rgb), 0.55); box-shadow: inset 0 0 0 1px rgba(var(--bad-rgb), 0.25), 0 0 60px rgba(var(--bad-rgb), 0.18); }
.twin.healing { border-color: rgba(var(--warn-rgb), 0.5); box-shadow: 0 0 50px rgba(var(--warn-rgb), 0.12); }
.twinbody { position: relative; flex: 1; min-height: 0; }
.twin.stale #cv, .twin.stale .hud { opacity: 0.4; filter: grayscale(0.85); transition: opacity .6s, filter .6s; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
#cv.drag { cursor: grabbing; }
.vignette { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .6s; background: radial-gradient(120% 100% at 50% 50%, transparent 55%, rgba(var(--bad-rgb), 0.38) 100%); }
.twin.alarm .vignette { opacity: 1; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.35; } }
.hud { position: absolute; pointer-events: none; }
.hud-tl { left: 1.2rem; top: 0.3rem; display: flex; flex-direction: column; gap: 0.6rem; }
.stat .k { font-size: 0.72rem; letter-spacing: 0.2em; color: var(--muted); text-transform: uppercase; }
.stat .v { font-family: var(--sans); font-size: 1.55rem; font-weight: 650; letter-spacing: 0.005em; margin-top: 0.1rem; white-space: nowrap; }
.stat .v small { font-size: 0.6em; color: var(--text-2); font-weight: 600; margin-left: 0.35em; }
.stat .v.run { color: var(--accent); }
.stat .v .spin { display: inline-block; width: 0.7em; height: 0.7em; margin-left: 0.4em; border: 2px solid rgba(var(--accent-rgb), 0.3); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: 0.05em; }
@keyframes spin { to { transform: rotate(360deg); } }
.hud-r { right: 1.1rem; top: 0.2rem; width: 13.5rem; display: flex; flex-direction: column; gap: 0.5rem; padding: 0.8rem 0.95rem; border-radius: 14px; background: rgba(6, 12, 24, 0.55); border: 1px solid var(--line); backdrop-filter: blur(8px); }
.hud-r:empty { display: none; }
.hud-r .t { font-size: 0.68rem; letter-spacing: 0.2em; color: var(--muted); text-transform: uppercase; margin-bottom: 0.1rem; }
.joint { display: grid; grid-template-columns: 4.3rem 1fr; align-items: baseline; row-gap: 0.25rem; }
.joint .n { font-size: 0.75rem; letter-spacing: 0.12em; color: var(--text-2); text-transform: uppercase; }
.joint .a { font-family: var(--sans); font-size: 1.12rem; font-weight: 600; text-align: right; }
.joint .a small { color: var(--muted); font-size: 0.75em; margin-left: 0.1em; }
.joint .g { grid-column: 1 / -1; height: 4px; border-radius: 3px; background: rgba(255,255,255,0.07); position: relative; overflow: hidden; }
.joint .g i { position: absolute; top: 0; bottom: 0; width: 6px; margin-left: -3px; border-radius: 3px; background: var(--accent); box-shadow: 0 0 8px var(--accent); transition: left .25s linear; }
.joint .g b { position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: rgba(255,255,255,0.18); }
.twin.alarm .joint .g i { background: var(--bad); box-shadow: 0 0 8px var(--bad); }
.hud-bl { left: 1.2rem; bottom: 1rem; display: flex; gap: 1.8rem; align-items: flex-end; }
.sensor .v { font-size: 2.6rem; font-weight: 700; }
.sensor .v.ok { color: var(--ok); }
.sensor .v.warn { color: var(--warn); }
.sensor .v.bad { color: var(--bad); }
.sensor .e { font-size: 0.95rem; color: var(--text-2); margin-top: 0.15rem; white-space: nowrap; }
.sensor .e b { color: var(--text); font-weight: 650; }
.hint { position: absolute; right: 1.2rem; bottom: 0.9rem; font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--faint); pointer-events: none; }
.banner {
  position: absolute; left: 50%; top: 0.4rem; transform: translate(-50%, -12px); opacity: 0; pointer-events: none;
  max-width: 58%; text-align: center; padding: 0.7rem 1.6rem 0.75rem; border-radius: 16px;
  transition: opacity .4s, transform .4s;
}
.banner.on { opacity: 1; transform: translate(-50%, 0); }
.banner .w { font-family: var(--sans); font-size: 2.2rem; font-weight: 800; letter-spacing: 0.12em; line-height: 1.05; }
.banner .s { font-size: 1.02rem; color: var(--text); margin-top: 0.35rem; line-height: 1.35; }
.banner.bad { background: rgba(60, 6, 18, 0.72); border: 1px solid rgba(var(--bad-rgb), 0.7); box-shadow: 0 0 60px rgba(var(--bad-rgb), 0.35); }
.banner.bad .w { color: var(--bad); text-shadow: 0 0 24px rgba(var(--bad-rgb), 0.8); }
.banner.warn { background: rgba(50, 34, 4, 0.72); border: 1px solid rgba(var(--warn-rgb), 0.65); box-shadow: 0 0 50px rgba(var(--warn-rgb), 0.25); }
.banner.warn .w { color: var(--warn); text-shadow: 0 0 22px rgba(var(--warn-rgb), 0.7); }
.banner.ok { background: rgba(4, 40, 30, 0.72); border: 1px solid rgba(var(--ok-rgb), 0.65); box-shadow: 0 0 50px rgba(var(--ok-rgb), 0.25); }
.banner.ok .w { color: var(--ok); text-shadow: 0 0 22px rgba(var(--ok-rgb), 0.7); }
.twinempty { position: absolute; inset: 0; display: flex; pointer-events: none; }

/* ---------- heal timeline ---------- */
.heal { height: clamp(150px, 24vh, 270px); }
.healbody { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 0.95fr) minmax(0, 2fr); gap: 1.1rem; padding: 0 1.2rem 1rem; }
.counters { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 0.6rem; min-height: 0; }
.ctr { border-radius: 12px; background: rgba(255,255,255,0.035); border: 1px solid var(--line); padding: 0.55rem 0.85rem; display: flex; flex-direction: column; justify-content: center; min-width: 0; overflow: hidden; }
.ctr .v { font-family: var(--sans); font-size: 2.45rem; font-weight: 700; line-height: 1; letter-spacing: -0.01em; }
.ctr .v small { font-size: 0.48em; font-weight: 600; color: var(--text-2); margin-left: 0.15em; letter-spacing: 0; }
.ctr .k { font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-top: 0.4rem; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.ctr.ok .v { color: var(--ok); }
.ctr.bad .v { color: var(--bad); }
.ctr.zero .v { color: var(--faint); }
.tl { position: relative; min-width: 0; min-height: 0; }
.tl svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.tl .tlempty { position: absolute; left: 0; right: 0; top: 34%; text-align: center; color: var(--muted); font-size: 0.98rem; }

/* ---------- jobs ---------- */
.kanban { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.6rem; padding: 0 1rem 1rem; }
.kcol { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 0.45rem; border-radius: 12px; padding: 0.5rem; background: rgba(255,255,255,0.025); border: 1px solid rgba(255,255,255,0.04); overflow: hidden; }
.kcol h3 { margin: 0 0 0.1rem; display: flex; justify-content: space-between; align-items: center; font-size: 0.7rem; letter-spacing: 0.18em; color: var(--muted); font-weight: 700; text-transform: uppercase; padding: 0.1rem 0.25rem; }
.kcol h3 .n { font-family: var(--sans); font-size: 0.95rem; letter-spacing: 0; color: var(--text-2); }
.kcol.doing h3 .n { color: var(--accent); }
.kcol.blocked h3 .n { color: var(--bad); }
.kcol.done h3 .n { color: var(--ok); }
.kc { border-radius: 10px; padding: 0.5rem 0.6rem; background: rgba(14, 26, 46, 0.85); border: 1px solid var(--line); min-width: 0; flex: none; }
.kc .o { font-family: var(--mono); font-size: 0.68rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; justify-content: space-between; gap: 0.4rem; }
.kc .o span:last-child { color: var(--faint); }
.kc .j { font-size: 0.98rem; font-weight: 600; margin-top: 0.15rem; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.kc .r { font-size: 0.78rem; color: var(--text-2); margin-top: 0.25rem; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.kc .r.res { color: rgba(var(--ok-rgb), 0.95); }
.kc .r.blk { color: rgba(255, 140, 150, 0.98); }
.kc.doing { border-color: rgba(var(--accent-rgb), 0.6); box-shadow: 0 0 22px rgba(var(--accent-rgb), 0.18), inset 0 0 0 1px rgba(var(--accent-rgb), 0.15); background: linear-gradient(110deg, rgba(14,26,46,0.9) 30%, rgba(var(--accent-rgb), 0.16) 50%, rgba(14,26,46,0.9) 70%); background-size: 250% 100%; animation: shimmer 2.4s linear infinite; }
.kc.doing.parked { border-color: rgba(var(--bad-rgb), 0.7); box-shadow: 0 0 22px rgba(var(--bad-rgb), 0.2); background: rgba(50, 10, 20, 0.8); animation: none; }
@keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }
.kc.blocked { border-color: rgba(var(--bad-rgb), 0.45); }
.kc.done { opacity: 0.92; }
.kc .step { margin-top: 0.3rem; font-size: 0.78rem; color: var(--accent); display: flex; align-items: center; gap: 0.35rem; }
.kc.parked .step { color: var(--bad); }
.kmore { font-size: 0.72rem; color: var(--faint); text-align: center; padding: 0.1rem; }
.kempty { color: var(--faint); font-size: 0.78rem; text-align: center; padding: 0.6rem 0.2rem; }

/* ---------- feed ---------- */
.feedlist { flex: 1; min-height: 0; overflow: hidden; padding: 0 0.9rem 0.6rem; display: flex; flex-direction: column; gap: 0.32rem; mask-image: linear-gradient(180deg, #000 78%, transparent); -webkit-mask-image: linear-gradient(180deg, #000 78%, transparent); }
.fi { display: grid; grid-template-columns: 1.9rem 4.9rem minmax(0, 1fr); align-items: center; gap: 0.6rem; padding: 0.42rem 0.6rem; border-radius: 10px; border: 1px solid transparent; flex: none; }
.fi .ic { width: 1.75rem; height: 1.75rem; border-radius: 8px; display: grid; place-items: center; background: rgba(255,255,255,0.05); color: var(--text-2); }
.fi .ic svg { width: 1.05rem; height: 1.05rem; }

<script>
"use strict";
// ---------- helpers ----------
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (x) => typeof x === "number" && isFinite(x);
const fmt = (x, d = 0, dash = "–") => (num(x) ? x.toFixed(d) : dash);
function ago(s) {
  if (!num(s) || s < 0) return "just now";
  if (s < 60) return `${Math.floor(s)} s`;
  if (s < 3600) return `${Math.floor(s / 60)} min`;
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return m ? `${h} h ${m} min` : `${h} h`;
}
function hms(ts) {
  if (!num(ts)) return "";
  return new Date(ts * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" }).replace(/\s?[AP]M$/i, "");
}
function hm(ts) { return new Date(ts * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }).replace(/\s?[AP]M$/i, ""); }
const setHTML = (() => { const last = new Map(); return (el, html) => { if (last.get(el) !== html) { el.innerHTML = html; last.set(el, html); } }; })();

const SHORT = { us_frozen: "stuck sensor", us_stuck: "stuck sensor", us_scale: "sensor scale wrong", us_offset: "sensor offset",
  us_residual: "sensor disagrees with the pose", us_noisy: "noisy sensor", us_missing_echo: "no echo", joint_stall: "joint stalled",
  pod_us_mismatch: "bad pod firmware", pod_clock_skew: "pod clock skew", pod_link_garbled: "pod link garbled", pod_us_no_echo: "pod: no echo" };
function short(kind) {
  if (!kind) return "fault";
  if (SHORT[kind]) return SHORT[kind];
  if (kind.startsWith("pod_")) return "sensor pod: " + kind.slice(4).replace(/_/g, " ");
  return kind.replace(/_/g, " ");
}
const JOINTS = [["shoulder_pan", "Pan", -110, 110], ["shoulder_lift", "Lift", -100, 100], ["elbow_flex", "Elbow", -97, 97],
  ["wrist_flex", "Wrist", -95, 95], ["wrist_roll", "Roll", -157, 163], ["gripper", "Grip", 0, 100]];

// ---------- icons (24x24, stroked) ----------
const IC = {
  order: "M3 7.5 12 3l9 4.5-9 4.5-9-4.5Z M3 7.5v9L12 21l9-4.5v-9 M12 12v9",
  claim: "M4 13h4l2 3h4l2-3h4 M4 13l2.5-8h11L20 13v6H4Z",
  start: "M8 5.5v13l10.5-6.5Z",
  skill: "M4 12h13 M12 6l6 6-6 6",
  incident: "M12 3.5 21.5 20h-19Z M12 10v4.5 M12 17.2v.3",
  heal: "M12 3l8 3v6c0 4.8-3.4 8-8 9-4.6-1-8-4.2-8-9V6Z M8.5 12.2l2.4 2.4 4.6-5",
  person: "M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z M4.5 21c.8-3.8 3.7-6 7.5-6s6.7 2.2 7.5 6",
  done: "M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z M8 12.3l2.8 2.8L16.2 9.5",
  blocked: "M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z M9 9l6 6 M15 9l-6 6",
  bolt: "M13 2.5 4.5 14h6.5l-1 7.5L18.5 10H12Z",
  spark: "M12 3v4 M12 17v4 M3 12h4 M17 12h4 M6 6l2.6 2.6 M15.4 15.4 18 18 M18 6l-2.6 2.6 M8.6 15.4 6 18",
  presenter: "M4 10v4l11 4.5V5.5Z M15 9a3 3 0 0 1 0 6 M7 15l1.2 4.5h3L10.4 16",
  soak: "M17 3l3.5 3.5L17 10 M4 11.5V9.5a3 3 0 0 1 3-3h13.5 M7 21l-3.5-3.5L7 14 M20 12.5v2a3 3 0 0 1-3 3H3.5",
  error: "M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z M12 7.5v6 M12 16.5v.3",
  dot: "M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z",
  pod: "M7 4h10v16H7Z M10 8h4 M12 17v.3",
};
const svg = (name) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${IC[name] || IC.dot}"/></svg>`;
const KIND = {
  order_placed: ["order", "acc"], card_claimed: ["claim", "acc"], job_started: ["start", "acc"], skill: ["skill", "dim"],
  incident: ["incident", "bad"], heal: ["heal", "ok"], handoff: ["person", "bad"], job_result: ["done", "ok"], card_done: ["done", "ok"],
  card_blocked: ["blocked", "bad"], fault_planted: ["bolt", "warn"], fault_cleared: ["spark", "ok"], presenter: ["presenter", "warn"],
  soak_tick: ["soak", "dim"], soak_outcome: ["soak", "acc"], error: ["error", "bad"],
  dispatcher: ["claim", "dim"], job_summary: ["done", "acc"], waiting: ["dot", "dim"], commander_line: ["skill", "dim"],
};
const SRC = { order: "order", dispatch: "dispatcher", commander: "commander", soak: "soak", mission: "presenter", host: "arm host", watchdog: "watchdog", "pod healer": "pod healer" };

// ---------- data ----------
let S = null;          // /api/state
let A = null;          // /api/arm (fresh, ~10 Hz)
let lastStateOk = 0;
async function getJSON(url) { const r = await fetch(url, { cache: "no-store" }); return r.json(); }
async function pollArm() {
  try { A = await getJSON("/api/arm"); } catch (e) { A = { error: "Mission Control server unreachable" }; }
  setTimeout(pollArm, A && !A.error ? 90 : 800);
}
async function pollState() {
  try { S = await getJSON("/api/state"); lastStateOk = Date.now(); render(); }
  catch (e) { S = null; render(); }
  setTimeout(pollState, 800);
}

// ---------- what state is the arm in ----------
function armMode(arm, st) {
  if (!arm || arm.error) return { cls: "off", word: "OFFLINE", why: "", sub: arm && arm.error ? "Waiting for the arm host" : "Connecting to Mission Control" };
  if (arm.stale) return { cls: "off", word: "NO SIGNAL", why: "", sub: `The arm host has been silent for ${ago(arm.age_s)}` };
  const open = arm.incidents || [];
  const pod = arm.pod || {};
  const act = (arm.activity && arm.activity.what) || "";
  if (open.length && open.some((i) => i.handed_off)) {
    const i = open.find((x) => x.handed_off);
    return { cls: "person", word: "NEEDS A PERSON:", why: short(i.kind), sub: `${(i.summary || short(i.kind)).replace(/\.$/, "")} · the arm stays parked until someone fixes it`, incident: i };
  }
  if (open.length) {
    const i = open[0];
    let what = null;
    if (act.startsWith("repair: restart_sensor")) what = "restarting the sensor through podd";
    else if (act.startsWith("repair")) what = "checked retry at home";
    else if (act.startsWith("verify")) what = "pod healed, checking at home";
    else if (pod.healer_busy) what = "pod healer rolling the firmware back";
    else if (open.some((x) => x.pod_healed)) what = "pod healed, checking at home";
    if (what) return { cls: "warn", word: "HEALING", why: "", sub: `${what} · ${short(i.kind)}`, incident: i, healing: what };

  drawBeam(m, beamCol, now);
  ctx.globalCompositeOperation = "source-over";
  requestAnimationFrame(frame);
}

resize();
tickClock(); setInterval(tickClock, 1000);
setInterval(() => { const mode = armMode(A, S); renderHeader(mode); renderTwinHud(mode); renderPod(); if (S) renderJobs(mode); }, 250);
pollArm(); pollState();
requestAnimationFrame(frame);
</script>
</body>
</html>
