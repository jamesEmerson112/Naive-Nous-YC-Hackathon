# uv workspace root for the Romulus cloud platform (architecture §3).
# Members: the shared contracts package, the cloud platform, the fake device, and the edge
# bridge (reports the pod healer's records to the cloud).
[tool.uv.workspace]
members = ["packages/contracts", "cloud", "tools/fake_device", "tools/edge_bridge"]

[tool.uv.sources]
romulus-contracts = { workspace = true }
fake-device = { workspace = true }

[dependency-groups]
dev = [
    "mcap>=1.2",  # F7 writes and reads a real MCAP log window
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Lint and format only our Python packages (an include-list, so teammates' new folders
# never break the cloud's lint). Teammates lint their own folders their own way.
include = ["packages/**/*.py", "cloud/**/*.py", "tools/**/*.py", "*.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["romulus_cloud", "romulus_contracts", "fake_device", "edge_bridge"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
# A test stuck this long dumps every thread's stack, naming what it waits on.
faulthandler_timeout = 120
testpaths = [
    "packages/contracts/tests",
    "cloud/tests",
    "tools/fake_device/tests",
    "tools/edge_bridge/tests",
]
