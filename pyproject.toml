# uv workspace root for the Romulus cloud platform (architecture §3).
# Members: the shared contracts package, the cloud platform, and the fake device.
[tool.uv.workspace]
members = ["packages/contracts", "cloud", "tools/fake_device"]

[tool.uv.sources]
romulus-contracts = { workspace = true }

[dependency-groups]
dev = [
    "mcap>=1.2",  # F7 writes and reads a real MCAP log window
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Lint and format only our Python packages; teammates' docs and folders are theirs.
extend-exclude = ["docs/**", "hub/**", "edge/**", "device/**", "firmware/**", "naive/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["romulus_cloud", "romulus_contracts", "fake_device"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["packages/contracts/tests", "cloud/tests", "tools/fake_device/tests"]
