[project]
name = "edge-bridge"
version = "0.1.0"
description = "Runs on the Pi next to the pod healer: reads what podd and the heal tools already record and reports it to the Romulus cloud through the device API."
requires-python = ">=3.12"
dependencies = [
    "romulus-contracts",
    "fake-device",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_bridge"]
