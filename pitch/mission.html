<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hardware Buddy · Mission</title>
<style>
:root{
  --bg:#07090C; --ink:#E6EAEE; --dim:#8A94A0; --mute:#5B6570; --faint:#2B323B;
  --tint:#13171C; --card:#0B0E12; --cardline:#20262E;
  --green:#3DDC97; --red:#FF5A5F; --amber:#FFB547; --accent:#7C9CFF;
  --sans:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;user-select:none;-webkit-user-select:none;cursor:default}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background-color:var(--bg);
  background-image:radial-gradient(circle at center, rgba(230,234,238,.07) 0 1.4px, transparent 2px);background-size:40px 40px}
.scene{position:absolute;left:0;top:0;width:1920px;height:1080px;opacity:0;visibility:hidden;transition:opacity .5s ease, visibility 0s linear .5s}
.scene.on{opacity:1;visibility:visible;transition:opacity .5s ease, visibility 0s}
#stage.instant .scene{transition:none}
.layer{position:absolute;left:0;top:0;width:1920px;height:1080px}
svg{overflow:visible}
.t{position:absolute;white-space:nowrap;color:var(--ink);font-family:var(--sans)}
.mono{font-family:var(--mono);text-transform:uppercase;letter-spacing:.12em}

/* line art */
.ln{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ln .ft,.ft{fill:var(--tint)}
.mute{stroke:var(--faint)}
.belt{stroke:var(--mute);stroke-dasharray:3 21}
.thin{stroke-width:1.5;opacity:.6}

/* Buddy mark */
.buddy{overflow:visible;display:block}
.buddy .bd-body{fill:#0E121B;stroke:var(--ink);stroke-width:5.5;stroke-linejoin:round}
.buddy .bd-pin{fill:none;stroke:var(--ink);stroke-width:5.5;stroke-linecap:round}
.buddy .bd-eye{fill:var(--accent);stroke:none}

/* pills */
.pill{display:inline-flex;align-items:center;gap:16px;padding:13px 28px 13px 24px;border-radius:999px;font:500 32px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;border:2px solid}
.pill .d{width:14px;height:14px;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor;flex:none}
.pill.g{color:var(--green);border-color:rgba(61,220,151,.45);background:rgba(61,220,151,.08)}
.pill.r{color:var(--red);border-color:rgba(255,90,95,.5);background:rgba(255,90,95,.1)}
.pillpos{position:absolute;left:960px;top:300px;transform:translate(-50%,-50%);display:grid;justify-items:center;align-items:center}
.pillpos>*{grid-area:1/1}

/* cards */
.card{position:absolute;background:var(--card);border:2px solid var(--cardline);border-radius:22px;padding:34px 36px;color:var(--ink);font-family:var(--sans)}
.ghost{position:absolute;border:2px dashed rgba(230,234,238,.13);border-radius:22px}
.chk{overflow:visible;display:block;flex:none}
.chk-c{fill:rgba(61,220,151,.1);stroke:var(--green);stroke-width:2.5}
.chk-p{fill:none;stroke:var(--green);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}

/* scene 1 */
.bignum{font:600 200px/1 var(--sans);letter-spacing:-.04em;font-variant-numeric:tabular-nums;display:flex;align-items:baseline}
.bignum .unit{font-size:84px;letter-spacing:-.02em;color:var(--dim);margin-left:26px;font-weight:500}
.cap{font:500 46px/1.2 var(--sans);color:var(--ink);margin-top:26px;letter-spacing:-.01em}
.foot{font-size:21px;color:var(--dim);margin-top:40px;line-height:1.7}
.foot:before{content:"";display:block;width:56px;height:2px;background:var(--faint);margin-bottom:18px}

/* scene 2 */
.atm{fill:none;stroke:rgba(230,234,238,.09);stroke-width:2}
.orbit{fill:none;stroke:#3E4650;stroke-width:2;stroke-dasharray:2 12;stroke-linecap:round}
.win{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.winh{fill:none;stroke:var(--ink);stroke-opacity:.12;stroke-width:16;stroke-linecap:round}
.cone{fill:rgba(230,234,238,.045);stroke:rgba(230,234,238,.13);stroke-width:1.5}
.pulse{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.remdot{fill:none;stroke:rgba(230,234,238,.6);stroke-width:3;stroke-linecap:round;stroke-dasharray:.5 12}
.wghost{fill:none;stroke:rgba(230,234,238,.3);stroke-width:3;stroke-linecap:round;stroke-dasharray:2 10}
.remx{fill:none;stroke:var(--red);stroke-width:3;stroke-linecap:round}
.lbl{font-size:32px;color:var(--ink)}
.guam{font-size:32px;color:var(--ink)}
.coord{font-size:21px;color:var(--dim);margin-left:18px;letter-spacing:.08em}
.nl2{font:500 32px/1 var(--sans);color:#FF8A8D;margin-left:14px}
.hline{font:600 76px/1.1 var(--sans);letter-spacing:-.03em}

/* scene 3 / 9 lockup */
.markbox{position:absolute;width:280px;height:280px}
.wm{font:600 128px/1 var(--sans);letter-spacing:-.04em}
.tag{font:500 52px/1.15 var(--sans);letter-spacing:-.015em}
.sub3{font-size:32px;color:var(--dim)}
.tag9{font:500 46px/1.2 var(--sans);color:var(--dim);letter-spacing:-.01em}
.l9a{font:500 62px/1.1 var(--sans);color:var(--dim);letter-spacing:-.015em}
.l9b{font:700 108px/1.05 var(--sans);letter-spacing:-.035em}

/* scene 4 */
.lk{stroke:#4A535E;stroke-width:2.5}
.lk.dash{stroke-dasharray:7 11}
.node{stroke:rgba(230,234,238,.55)}
.env .ft,.env path{stroke:var(--accent);stroke-width:2.5}
.ring{fill:none;stroke:var(--accent);stroke-width:2.5}
.flow{fill:var(--accent);stroke:none}
.bgc{fill:var(--bg);stroke:none}
.step{font-size:32px;color:var(--ink)}
.step b{color:var(--accent);font-weight:600}
.nlab{font:500 38px/1 var(--sans);text-align:center}
.term{padding:24px 34px 22px}
.term-h{display:flex;justify-content:space-between;align-items:center;font-size:21px;color:var(--dim);margin-bottom:10px;padding-bottom:14px;border-bottom:2px solid #171C22}
.st{display:inline-flex;align-items:center;gap:10px;color:var(--accent)}
.st .d{width:10px;height:10px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.term-row{display:flex;align-items:center;gap:22px;font:400 32px/62px var(--mono);color:var(--ink)}
.term-row .ic{position:relative;width:44px;height:44px;flex:none}
.term-row .ic svg{position:absolute;left:0;top:0}
.spin{transform-origin:22px 22px}

/* scene 5 */
.lab{font-size:32px;color:var(--ink)}
.card-h{display:flex;justify-content:space-between;align-items:center;height:40px}
.sdot{position:relative;width:18px;height:18px;border-radius:50%;background:var(--green);box-shadow:0 0 14px rgba(61,220,151,.75)}
.sdot .ring{position:absolute;left:-2px;top:-2px;width:22px;height:22px;border:2px solid var(--green);border-radius:50%}
.cicon{position:absolute;left:0;top:88px;width:596px;height:300px}
.buls{position:absolute;left:36px;top:418px}
.bul{display:flex;align-items:flex-start;gap:20px;font:500 38px/1.22 var(--sans);margin-bottom:16px;white-space:nowrap}
.bul i{flex:none;width:20px;height:2px;background:var(--dim);margin-top:24px}
.lk-solid{stroke:rgba(230,234,238,.8);stroke-width:2.5}
.lk-dash{stroke:#5B6570;stroke-width:2.5;stroke-dasharray:8 12}
.port{fill:var(--bg);stroke:rgba(230,234,238,.8);stroke-width:2}
.pkt{fill:var(--accent);stroke:none}
.lkl{font-size:32px;color:var(--dim)}
#s5Lart{stroke-width:1.64}
#s5arm{stroke-width:4.1}
#s5cloud{stroke-width:1.75}

/* scene 6 */
.hl{font:600 96px/1.05 var(--sans);letter-spacing:-.035em}
.ecg{fill:none;stroke:var(--green);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ecgh{fill:none;stroke:var(--green);stroke-opacity:.13;stroke-width:10;stroke-linejoin:round;stroke-linecap:round}
.head{fill:var(--green)}
.ct{font:600 50px/1.1 var(--sans);letter-spacing:-.02em}
.mrow{display:flex;justify-content:space-between;margin-top:34px;font-size:32px}
.ml{color:var(--dim)}
.mv{color:var(--ink);font-variant-numeric:tabular-nums}
.meter{display:flex;gap:5px;margin-top:16px;height:36px}
.meter i{flex:1;border-radius:3px;background:#161B21}
.res{position:absolute;left:36px;bottom:34px;display:flex;align-items:center;gap:18px;font:500 40px/1 var(--sans)}
.code{margin-top:26px;border:2px solid #1B2129;border-radius:12px;background:#080A0D;padding:8px 0;font:400 32px/56px var(--mono);color:var(--ink)}
.cl{position:relative;padding:0 16px;white-space:pre}
.cl .sg{display:inline-block;width:2ch}
.cl.del{background:rgba(255,90,95,.12)}
.cl.del .sg{color:var(--red)}
.cl.add .sg{color:var(--green)}
.strike{position:absolute;left:calc(16px + 2ch);top:50%;height:3px;margin-top:-1px;width:30ch;background:var(--red);transform-origin:left center;border-radius:2px}
.caret{display:inline-block;width:.55ch;height:36px;background:var(--accent);vertical-align:-6px;margin-left:2px}

/* scene 7 */
.kick{font-size:32px;color:var(--dim)}
.nd{stroke:rgba(230,234,238,.35)}
.nd.r{stroke:rgba(255,90,95,.6)}
.nd.g{stroke:rgba(61,220,151,.6)}
.ico-r{stroke:var(--red);stroke-width:2.5}
.dotf{fill:var(--red);stroke:none}
.ico-g{stroke:var(--green);stroke-width:3.2}
.arr{stroke:rgba(230,234,238,.45);stroke-width:2.5}
.arr.ac{stroke:var(--accent)}
.band-r{fill:rgba(255,90,95,.13);stroke:rgba(255,90,95,.6);stroke-width:2}
.band-g{fill:rgba(61,220,151,.13);stroke:rgba(61,220,151,.6);stroke-width:2}
.bt{font:500 32px/1 var(--sans)}
.bt.r{color:#FF8A8D}
.bt.g{color:#7DEBB9}
.nl7{font:500 32px/1 var(--sans);color:var(--ink);text-align:center}

/* scene 8 */
.kick8{display:inline-flex;align-items:center;gap:18px;font-size:32px;color:var(--dim)}
.kick8 .d{width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px rgba(124,156,255,.8)}
.title8{font:600 132px/1 var(--sans);letter-spacing:-.04em}
.rule8{position:absolute;height:2px;background:rgba(230,234,238,.3)}
.meta8{font-size:32px;color:var(--dim)}
.sep{margin:0 .6em;color:#4A535E}

/* HUD */
#hud{position:absolute;left:0;right:0;bottom:30px;display:flex;justify-content:center;gap:12px;opacity:.6;transition:opacity .3s;pointer-events:none;z-index:5}
#hud.hide{opacity:0}
#hud i{width:8px;height:8px;border-radius:4px;background:#323943;transition:width .3s, background .3s}
#hud i.on{width:26px;background:#8A94A0}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="earthFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6EAEE" stop-opacity=".075"/>
      <stop offset=".45" stop-color="#E6EAEE" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
<div id="stage"><div id="hud"></div></div>

<script>
(function(){
'use strict';
const BIG = 1e9, SNAP = 1e6;
const cl = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const pr = (t, s, d) => cl((t - s) / d);
const mix = (a, b, p) => a + (b - a) * p;
const E = {
  o: p => 1 - Math.pow(1 - p, 3),
  io: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  i: p => p * p,
  back: p => { const c1 = 1.7, c3 = c1 + 1; return p >= 1 ? 1 : 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); }
};
const $ = id => document.getElementById(id);
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const C = { ink: '#E6EAEE', dim: '#8A94A0', green: '#3DDC97', red: '#FF5A5F', amber: '#FFB547', accent: '#7C9CFF', cardline: '#20262E', seg: '#161B21' };
function mixc(a, b, p) { const A = hex(a), B = hex(b); return 'rgb(' + Math.round(mix(A[0], B[0], p)) + ',' + Math.round(mix(A[1], B[1], p)) + ',' + Math.round(mix(A[2], B[2], p)) + ')'; }

/* ---------- element helpers (pure setters: every frame sets full state) ---------- */
function op(el, o) { el.style.opacity = o; el.style.visibility = o <= 0.001 ? 'hidden' : ''; }
function rise(el, p, dy = 22) { op(el, p); el.style.transform = (p >= 1 || dy === 0) ? '' : 'translateY(' + ((1 - p) * dy).toFixed(2) + 'px)'; }
const LEN = new WeakMap();
function glen(el) { let l = LEN.get(el); if (l === undefined) { try { l = el.getTotalLength(); } catch (e) { l = 1000; } LEN.set(el, l); } return l; }
function drawIn(el, p) {
  if (p >= 1) { el.style.strokeDasharray = ''; el.style.strokeDashoffset = ''; el.style.visibility = ''; return; }
  if (p <= 0) { el.style.visibility = 'hidden'; return; }
  const l = glen(el) + 2;
  el.style.visibility = '';
  el.style.strokeDasharray = l + ' ' + l;
  el.style.strokeDashoffset = (l * (1 - p)).toFixed(2);
}
function blink(now, seed = 0) {
  const P = 4300, tt = now + seed * 1373, c = Math.floor(tt / P), x = tt - c * P;
  let o = 1;
  const b = x0 => { const d = (x - x0) / 180; if (d > 0 && d < 1) o = Math.min(o, 1 - 0.92 * Math.sin(Math.PI * d)); };
  b(0); if (c % 3 === 1) b(260);
  return o;
}

/* ---------- the Buddy mark: built once here, reused everywhere ---------- */
function buddySVG(attrs = '') {
  const pins = [];
  [58, 80, 102].forEach(k => pins.push('M' + k + ' 32V14'));
  [58, 80, 102].forEach(k => pins.push('M128 ' + k + 'H146'));
  [102, 80, 58].forEach(k => pins.push('M' + k + ' 128V146'));
  [102, 80, 58].forEach(k => pins.push('M32 ' + k + 'H14'));
  return '<svg class="buddy" viewBox="0 0 160 160" ' + attrs + '>' +
    pins.map(d => '<path class="bd-pin" d="' + d + '"/>').join('') +
    '<rect class="bd-body" x="32" y="32" width="96" height="96" rx="22"/>' +
    '<g class="bd-eyes" filter="url(#glow)"><ellipse class="bd-eye" cx="64" cy="80" rx="9" ry="15"/><ellipse class="bd-eye" cx="96" cy="80" rx="9" ry="15"/></g>' +
    '</svg>';
}
function Buddy(svg) {
  const body = svg.querySelector('.bd-body'), pins = [...svg.querySelectorAll('.bd-pin')],
    eyes = [...svg.querySelectorAll('.bd-eye')], eg = svg.querySelector('.bd-eyes');
  let last = '';
  return {
    svg,
    // d: draw-in progress 0..1, o: eye openness 0..1, a: eye alpha 0..1
    set(d = 1, o = 1, a = 1) {
      const key = d.toFixed(3) + '|' + o.toFixed(3) + '|' + a.toFixed(3);
      if (key === last) return; last = key;
      if (d >= 1) { drawIn(body, 1); body.style.fillOpacity = ''; pins.forEach(p => drawIn(p, 1)); }
      else {
        drawIn(body, E.io(cl(d / 0.6)));
        body.style.fillOpacity = cl((d - 0.4) / 0.4);
        pins.forEach((p, i) => drawIn(p, E.o(cl((d - 0.38 - i * 0.03) / 0.22))));
      }
      eyes.forEach(e => e.setAttribute('ry', Math.max(1.8, 15 * cl(o)).toFixed(2)));
      op(eg, cl(a));
    }
  };
}
const chkSVG = (id = '') => '<svg class="chk" ' + (id ? 'id="' + id + '" ' : '') + 'viewBox="0 0 44 44" width="44" height="44"><circle class="chk-c" cx="22" cy="22" r="19"/><path class="chk-p" d="M13.5 22.5 L19.5 28.5 L31 16.5"/></svg>';
function Chk(svg) { const c = svg.querySelector('.chk-c'), p = svg.querySelector('.chk-p'); return { set(x) { op(c, cl(x * 2)); drawIn(p, E.o(cl((x - 0.25) / 0.75))); } }; }

/* ---------- the robot arm (side view, rotating joint groups) ---------- */
function armMarkup(p, L1, L2) {
  return '<g id="' + p + 'g1">' +
    '<rect class="ft" x="-21" y="-21" width="' + (L1 + 42) + '" height="42" rx="21"/>' +
    '<circle class="ft" r="31"/><circle r="10"/>' +
    '<g id="' + p + 'g2">' +
      '<rect class="ft" x="-17" y="-17" width="' + (L2 + 34) + '" height="34" rx="17"/>' +
      '<circle class="ft" r="25"/><circle r="8"/>' +
      '<g id="' + p + 'g3">' +
        '<rect class="ft" x="12" y="-10" width="20" height="20" rx="3"/>' +
        '<rect class="ft" x="30" y="-58" width="14" height="116" rx="5"/>' +
        '<rect id="' + p + 'fa" class="ft" x="44" y="35" width="48" height="11" rx="4"/>' +
        '<rect id="' + p + 'fb" class="ft" x="44" y="-46" width="48" height="11" rx="4"/>' +
        '<circle class="ft" r="17"/><circle r="5.5"/>' +
      '</g>' +
    '</g>' +
  '</g>';
}
function armEls(p) { return { g1: $(p + 'g1'), g2: $(p + 'g2'), g3: $(p + 'g3'), fa: $(p + 'fa'), fb: $(p + 'fb') }; }
function poseArm(a, th1, a2, a3, f, ox, oy, L1, L2) {
  a.g1.setAttribute('transform', 'translate(' + ox + ' ' + oy + ') rotate(' + th1.toFixed(3) + ')');
  a.g2.setAttribute('transform', 'translate(' + L1 + ' 0) rotate(' + a2.toFixed(3) + ')');
  a.g3.setAttribute('transform', 'translate(' + L2 + ' 0) rotate(' + a3.toFixed(3) + ')');
  a.fa.setAttribute('y', (f - 5.5).toFixed(2));
  a.fb.setAttribute('y', (-f - 5.5).toFixed(2));
}

/* ======================= SCENE 1 · Downtime ======================= */
const S1 = (() => {
  const SX = 1340, SY = 770, L1 = 290, L2 = 270, PX = 930, D = 220, P = 4000;
  const HP = [930, 470], GP = [930, 574], HB = [1140, 560], RB = [1140, 674];
  const rnd = k => { const x = Math.sin(k * 127.1 + 311.7) * 43758.5453; return (x - Math.floor(x)) * 2 - 1; };
  const seg = (a, b, p) => [mix(a[0], b[0], p), mix(a[1], b[1], p)];
  function wristAt(ph) {
    if (ph < 600) return seg(HP, GP, E.io(ph / 600));
    if (ph < 800) return GP;
    if (ph < 1300) return seg(GP, HP, E.io((ph - 800) / 500));
    if (ph < 2200) { const p = E.io((ph - 1300) / 900); const w = seg(HP, HB, p); w[1] -= 46 * Math.sin(Math.PI * p); return w; }
    if (ph < 2600) return seg(HB, RB, E.io((ph - 2200) / 400));
    if (ph < 2750) return RB;
    if (ph < 3150) return seg(RB, HB, E.io((ph - 2750) / 400));
    const p = E.io((ph - 3150) / 850); const w = seg(HB, HP, p); w[1] -= 30 * Math.sin(Math.PI * p); return w;
  }
  function fingerAt(ph) {
    if (ph < 600) return 52;
    if (ph < 800) return mix(52, 40.5, E.io((ph - 600) / 200));
    if (ph < 2600) return 40.5;
    if (ph < 2750) return mix(40.5, 52, E.io((ph - 2600) / 150));
    return 52;
  }
  const beltAt = ph => ph < 1300 ? 0 : ph < 3300 ? D * E.io((ph - 1300) / 2000) : D;
  function ik(x, y) {
    const dx = x - SX, dy = y - SY, d = Math.min(Math.hypot(dx, dy), L1 + L2 - 0.5);
    const c = cl((d * d - L1 * L1 - L2 * L2) / (2 * L1 * L2), -1, 1), a2 = -Math.acos(c);
    const th1 = Math.atan2(dy, dx) - Math.atan2(L2 * Math.sin(a2), L1 + L2 * Math.cos(a2));
    return [th1 * 180 / Math.PI, a2 * 180 / Math.PI];
  }
  function fk(th1, a2, a3) {
    const r = Math.PI / 180, ex = SX + L1 * Math.cos(th1 * r), ey = SY + L1 * Math.sin(th1 * r), t2 = th1 + a2;
    return { x: ex + L2 * Math.cos(t2 * r), y: ey + L2 * Math.sin(t2 * r), g: t2 + a3 };
  }
  const box = '<g class="box"><rect class="ft" x="-35" y="0" width="70" height="70" rx="5"/><path d="M0 0V24M-35 12H-24M24 12H35"/></g>';
  let el = {}, tau0 = 1100;
  return {
    name: 'Downtime', beats: [2500, 4500],
    html: `
    <div id="s1m" class="layer" style="transform-origin:960px 640px">
      <svg id="s1svg" class="layer" viewBox="0 0 1920 1080" width="1920" height="1080">

      const out = b === 2 ? E.io(pr(t2, 0, 450)) : 0;
      const a = E.o(pr(t1, 100, 700)), bb = E.o(pr(t1, 900, 800));
      op(el.a, a * (1 - out)); el.a.style.transform = 'translateY(' + ((1 - a) * 16 - out * 30).toFixed(1) + 'px)';
      op(el.b, bb * (1 - out)); el.b.style.transform = 'translateY(' + ((1 - bb) * 22 - out * 30).toFixed(1) + 'px)';
      const mp = E.o(pr(t2, 380, 650));
      op(el.mk, mp); el.mk.style.transform = mp >= 1 ? '' : 'scale(' + (0.92 + 0.08 * mp).toFixed(4) + ')';
      let o = 0.12 + 0.88 * E.o(pr(t2, 850, 300));
      if (t2 > 2200) o = Math.min(o, blink(now, 5));
      mark.set(1, o, pr(t2, 800, 200));
      rise(el.wm, E.o(pr(t2, 900, 600)), 24);
      rise(el.tag, E.o(pr(t2, 1350, 600)), 16);
    }
  };
})();

/* ======================= engine ======================= */
const scenes = [S1, S2, S3, S4, S5, S6, S7, S8, S9];
const stage = $('stage'), hud = $('hud');
scenes.forEach((sc, i) => {
  const sec = document.createElement('section');
  sec.className = 'scene'; sec.id = 'sc' + (i + 1); sec.innerHTML = sc.html;
  stage.insertBefore(sec, hud); sc.el = sec;
});
scenes.forEach(sc => sc.init());
hud.innerHTML = scenes.map(() => '<i></i>').join('');

const qs = new URLSearchParams(location.search);
let auto = qs.get('auto') === '1', hudHidden = false;
let cur = { s: -1, b: 1, t0: 0, autoT0: 0 };

function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = 'translate(' + ((innerWidth - 1920 * s) / 2).toFixed(2) + 'px,' + ((innerHeight - 1080 * s) / 2).toFixed(2) + 'px) scale(' + s + ')';
}
function updHud() {
  [...hud.children].forEach((d, i) => d.classList.toggle('on', i === cur.s));
  hud.classList.toggle('hide', hudHidden || auto);
}
function setScene(i, b, mode) {
  const now = performance.now();
  const prev = { s: cur.s, b: cur.b, t: now - cur.t0 };
  const sc = scenes[i];
  cur = { s: i, b: b, t0: mode === 'snap' ? now - SNAP : now, autoT0: now };
  if (sc.enter) sc.enter(b, prev, mode);
  sc.draw(b, now - cur.t0, now);          // render the first frame before it becomes visible
  scenes.forEach((x, k) => x.el.classList.toggle('on', k === i));
  const h = '#' + (i + 1);
  if (location.hash !== h) { try { history.replaceState(null, '', location.pathname + location.search + h); } catch (e) {} }
  updHud();
}
function next() {
  const sc = scenes[cur.s];
  if (cur.b < sc.beats.length) setScene(cur.s, cur.b + 1, 'play');
  else if (cur.s < scenes.length - 1) setScene(cur.s + 1, 1, 'play');
}
function prev() {
  if (cur.b > 1) setScene(cur.s, cur.b - 1, 'snap');
  else if (cur.s > 0) setScene(cur.s - 1, scenes[cur.s - 1].beats.length, 'snap');
}
function instant(fn) {
  stage.classList.add('instant'); fn(); void stage.offsetWidth;
  requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.remove('instant')));
}
function toggleFS() {
  const d = document, de = d.documentElement;
  if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  else (de.requestFullscreen || de.webkitRequestFullscreen).call(de);
}
let errLogged = false;
function autoTick() {
  if (auto && performance.now() - cur.autoT0 >= scenes[cur.s].beats[cur.b - 1]) next();
}
function frame(now) {
  const sc = scenes[cur.s];
  try { sc.draw(cur.b, now - cur.t0, now); } catch (e) { if (!errLogged) { console.error(e); errLogged = true; } }
  autoTick();
  requestAnimationFrame(frame);
}
setInterval(autoTick, 100);   // autoplay keeps time even if frames are throttled

window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === 'ArrowRight' || k === ' ' || k === 'Spacebar' || k === 'PageDown' || k === 'Enter') { e.preventDefault(); next(); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); prev(); }
  else if (k === 'Home') { e.preventDefault(); setScene(0, 1, 'play'); }
  else if (/^[1-9]$/.test(k)) { setScene(+k - 1, 1, 'play'); }
  else if (k === 'a' || k === 'A') { auto = !auto; cur.autoT0 = performance.now(); updHud(); }
  else if (k === 'f' || k === 'F') { toggleFS(); }
  else if (k === 'h' || k === 'H') { hudHidden = !hudHidden; updHud(); }
});
window.addEventListener('click', e => { if (e.button === 0) next(); });
window.addEventListener('resize', fit);
window.addEventListener('hashchange', () => {
  const n = parseInt(location.hash.slice(1), 10);
  if (n >= 1 && n <= 9 && n - 1 !== cur.s) setScene(n - 1, 1, 'play');
});

window.__pitch = {
  go(s, b = 1) {
    const i = cl(Math.round(s), 1, scenes.length) - 1;
    const bb = cl(Math.round(b), 1, scenes[i].beats.length);
    instant(() => setScene(i, bb, 'snap'));
    return this.state();
  },
  state() {
    return { scene: cur.s + 1, beat: cur.b, beats: scenes[cur.s].beats.length, name: scenes[cur.s].name, autoplay: auto, hud: !(hudHidden || auto), t: Math.round(performance.now() - cur.t0) };
  }
};

fit();
const h0 = parseInt(location.hash.slice(1), 10);
instant(() => setScene(h0 >= 1 && h0 <= 9 ? h0 - 1 : 0, 1, 'play'));
requestAnimationFrame(frame);
})();
</script>
