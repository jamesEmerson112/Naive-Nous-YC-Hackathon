<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hardware Buddy · Keynote</title>
<style>
:root{
  --bg:#F5F5F2; --ink:#0E0E10; --ink2:#6B6B70; --line:#BDBDB7;
  --green:#12A150; --greenT:#0B8A42; --red:#E5484D; --redT:#CF2F35; --amber:#F5A524; --amberT:#A86A06; --blue:#2563FF;
  --dark:#1F1F23;
  --shadow:0 1px 2px rgba(14,14,16,.05),0 22px 54px rgba(14,14,16,.08);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  --text:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{cursor:default}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%;
  background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:visible;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;user-select:none;-webkit-user-select:none}
#scenes,.scene{position:absolute;inset:0}
.abs{position:absolute}
.full{position:absolute;left:0;top:0;width:1920px;height:1080px}
svg{display:block;overflow:visible}
.hid{opacity:0}

/* line reveal: a mask with a short upward slide */
.mask{display:block;overflow:hidden;padding:.02em .1em .18em;margin:-.02em -.1em -.18em}
.mask.inl{display:inline-block;vertical-align:top}
.in{display:block;transform:translateY(112%);opacity:0}

/* type */
.h-xxl{font-weight:700;font-size:156px;line-height:1.04;letter-spacing:-.038em}
.h-xl{font-weight:700;font-size:120px;line-height:1.05;letter-spacing:-.034em}
.h-l{font-weight:700;font-size:104px;line-height:1.08;letter-spacing:-.03em}
.lbl{font-family:var(--text);font-weight:500;font-size:34px;color:var(--ink2);letter-spacing:-.005em}
.center{text-align:center}

/* the Buddy mark */
.buddy .bd-body{fill:var(--blue)}
.buddy .bd-pin{fill:#1946C7}
.buddy .bd-eye{fill:#fff}
.buddy .bd-body,.buddy .bd-eye{transform-box:fill-box;transform-origin:50% 50%}
.buddy.draw .bd-body,.buddy.draw .bd-pin{opacity:0}
.buddy.draw .bd-eye{opacity:0;transform:scaleY(.12)}
.buddy.alive .bd-eye{animation:blink 5.4s var(--bd,1.8s) infinite}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}93.2%{transform:scaleY(.1)}95.6%{transform:scaleY(1)}}

/* cards + pills */
.card{background:#fff;border-radius:40px;box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:16px;height:72px;padding:0 34px 0 28px;border-radius:36px;
  font:600 34px/1 var(--text);letter-spacing:.08em;background:rgba(18,161,80,.12);color:var(--greenT)}
.pill .dot{width:18px;height:18px;border-radius:50%;background:var(--green)}
.pill.down{background:rgba(229,72,77,.12);color:var(--redT)}
.pill.down .dot{background:var(--red)}
.pill.red{background:rgba(229,72,77,.12);color:var(--redT);letter-spacing:.01em;font-weight:500}
.pill.red b{font-weight:700;letter-spacing:.06em;margin-right:-.06em}

/* HUD */
#hud{position:absolute;left:0;right:0;bottom:30px;display:flex;justify-content:center;gap:14px;pointer-events:none}
#hud i{display:block;width:10px;height:10px;border-radius:5px;background:rgba(14,14,16,.12)}
#hud i.on{width:28px;background:rgba(14,14,16,.34)}
#stage.nohud #hud{opacity:0}

/* scene 1 */
.s1-group{transform-origin:960px 520px}
.s1-num{font-weight:700;font-size:168px;line-height:1;letter-spacing:-.045em}
.s1-cap{margin-top:30px;font-weight:500;font-size:54px;line-height:1.16;letter-spacing:-.02em}
.s1-foot{margin-top:44px;font-family:var(--text);font-weight:400;font-size:24px;color:var(--ink2)}

/* scene 2 */
.s2-xi{transform-box:fill-box;transform-origin:50% 50%}

/* scene 3 */
.s3-mark{width:270px;height:270px;filter:drop-shadow(0 26px 34px rgba(37,99,255,.22))}
.stack{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.wordmark{font-weight:700;font-size:164px;line-height:1.02;letter-spacing:-.042em}
.tagline{font-weight:600;font-size:60px;letter-spacing:-.02em;line-height:1.15}
.subline{font-family:var(--text);font-weight:500;font-size:40px;color:var(--ink2);line-height:1.2}

/* scene 4 */
.tile{width:200px;height:200px;border-radius:52px;background:#fff;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
.tlabel{text-align:center;font-weight:600;font-size:38px;letter-spacing:-.015em}
.step{text-align:center;font-family:var(--text);font-weight:600;font-size:36px;letter-spacing:-.005em;color:var(--ink)}
.step b{color:var(--blue)}
.step .sep{color:var(--ink2);margin:0 .22em}
.term{background:#fff;border-radius:30px;box-shadow:var(--shadow);padding:0 44px 26px}
.term-h{height:66px;display:flex;align-items:center;gap:11px}
.term-h i{width:15px;height:15px;border-radius:50%;background:#E2E2DC}
.tl{display:flex;align-items:center;gap:22px;height:68px;font:500 34px/1 var(--mono);color:var(--ink);opacity:0}
.tl .ck{display:block;opacity:0}

/* scene 5 */
.ctitle{position:absolute;left:54px;top:46px;font-weight:700;font-size:72px;line-height:1;letter-spacing:-.035em}
.cill{position:absolute;left:120px;top:132px;width:420px;height:257px}
.bul{position:absolute;left:56px;display:flex;align-items:center;gap:18px;font-family:var(--text);font-weight:500;font-size:34px;color:var(--ink);white-space:nowrap}
.bul i{width:10px;height:10px;border-radius:50%;background:var(--ink2)}
.s5-local.pulsing{animation:glow 1.25s ease-out infinite}
@keyframes glow{0%{box-shadow:var(--shadow),0 0 0 0 rgba(18,161,80,.55)}100%{box-shadow:var(--shadow),0 0 0 28px rgba(18,161,80,0)}}
.lamp-ring{transform-box:fill-box;transform-origin:50% 50%;animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.55}70%,100%{transform:scale(2.6);opacity:0}}
.s5-lbl{text-align:center;font-family:var(--text);font-weight:500;font-size:32px;height:44px}
.s5-lbl span{position:absolute;left:0;right:0;top:0;opacity:0}
.s5-lbl .t-off{color:var(--ink2)}
.s5-lbl .t-on{color:var(--ink)}
.pk{width:22px;height:22px;border-radius:7px;background:var(--blue);opacity:0}

/* scene 6 */
.s6-mk{transform-box:fill-box;transform-origin:50% 50%}
.ctitle2{position:absolute;left:54px;top:46px;font-weight:700;font-size:60px;line-height:1;letter-spacing:-.03em}
.part{display:flex;align-items:center;gap:16px;font-family:var(--text);font-weight:500;font-size:36px;color:var(--ink2)}
.mrow{display:flex;justify-content:space-between;font-family:var(--text);font-weight:500;font-size:32px;color:var(--ink2)}
.mrow .s6-pct{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.meter{height:26px;border-radius:13px;background:#EBEBE6;overflow:hidden}
.mfill{width:86%;height:100%;border-radius:13px;background:var(--green);transform:scaleX(0);transform-origin:0 50%}
.res{display:flex;align-items:center;gap:20px;font-weight:600;font-size:44px;letter-spacing:-.02em;white-space:nowrap}
.res .ck{display:block}
.dl{position:relative;height:66px;display:flex;align-items:center;padding:0 16px;border-radius:14px;font:500 32px/1 var(--mono);color:var(--ink);white-space:pre}
.dl .sg{display:inline-block;width:36px;font-weight:700}
.dl.del{background:rgba(229,72,77,.10)}
.dl.del .sg{color:var(--redT)}
.dl.add{margin-top:12px;background:rgba(18,161,80,.12)}
.dl.add .sg{color:var(--greenT)}
.strike{position:absolute;left:52px;top:31px;width:30ch;height:4px;border-radius:2px;background:var(--red);transform:scaleX(0);transform-origin:0 50%}

/* scene 7 */
.rowh{font-weight:700;font-size:54px;letter-spacing:-.025em;line-height:1.1}
.node{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.node .nl{font-family:var(--text);font-weight:500;font-size:34px;color:var(--ink2);white-space:nowrap}
.band{height:70px;border-radius:35px;display:flex;align-items:center;justify-content:center;transform:scaleX(0);transform-origin:0 50%}
.band span{font-family:var(--text);font-weight:600;font-size:34px;color:#fff;opacity:0;white-space:nowrap;letter-spacing:.005em}
.band.bad{background:var(--red)}
.band.good{background:#119A4C}

/* scene 8 */
.kick{display:flex;align-items:center;gap:18px;font-family:var(--text);font-weight:600;font-size:34px;letter-spacing:.2em;color:var(--ink2);margin-bottom:26px}
.s8-sub{margin-top:34px;font-family:var(--text);font-weight:500;font-size:40px;color:var(--ink2)}

/* scene 9 */
.s9-l1{font-weight:500;font-size:64px;letter-spacing:-.02em;color:var(--ink2);margin-bottom:22px}
.s9-mark{width:220px;height:220px;filter:drop-shadow(0 22px 30px rgba(37,99,255,.2))}
.s9-word{font-weight:700;font-size:150px;line-height:1.02;letter-spacing:-.042em;margin-top:34px}
.s9-tag{margin-top:22px;font-family:var(--text);font-weight:500;font-size:48px;color:var(--ink2)}
</style>
</head>
<body>
<div id="stage"><div id="scenes"></div><div id="hud"></div></div>
<script>
(() => {
'use strict';

/* ================================================================
   Basics
   ================================================================ */
const stage = document.getElementById('stage');
const scenesEl = document.getElementById('scenes');
const hud = document.getElementById('hud');
const $ = (r, s) => r.querySelector(s);
const $$ = (r, s) => Array.from(r.querySelectorAll(s));
const PI = Math.PI, R2D = 180 / PI;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const E = {
  lin: t => t,
  out: t => 1 - Math.pow(1 - t, 3),
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  sine: t => -(Math.cos(PI * t) - 1) / 2,
};
const EASE = 'cubic-bezier(.22,1,.36,1)';     // slow, confident ease-out
const EASE_IO = 'cubic-bezier(.65,0,.35,1)';  // ease-in-out for moves

function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize', fit);
fit();

/* ================================================================
   Animator. Every beat is a function (root, A). A.instant snaps to
   the end state (a virtual clock runs the timeline in order, at once);
   otherwise it plays with real timers. GEN cancels everything pending.
   ================================================================ */
let GEN = 0;
const timers = new Set();
function cancelAll() {
  GEN++;
  timers.forEach(clearTimeout);
  timers.clear();
}
const STRIP = { offset: 1, easing: 1, composite: 1 };
function finalStyle(el, f) { for (const k in f) if (!STRIP[k]) el.style[k] = f[k]; }

function makeA(instant, current) {
  const g = GEN, q = [];
  let vnow = 0, seq = 0;
  const A = {
    instant, current,
    at(ms, fn) {
      if (instant) { q.push({ t: vnow + ms, s: seq++, fn }); return; }
      if (ms <= 0) { fn(); return; }
      const id = setTimeout(() => { timers.delete(id); if (g === GEN) fn(); }, ms);
      timers.add(id);
    },
    anim(el, from, to, o = {}) {
      if (!el) return;
      A.at(o.delay || 0, () => {
        finalStyle(el, to);
        if (!instant) el.animate([from, to], { duration: o.dur ?? 800, easing: o.ease ?? EASE });
      });
    },
    kf(el, frames, o = {}) {
      if (!el) return;
      A.at(o.delay || 0, () => {
        finalStyle(el, frames[frames.length - 1]);
        if (!instant) el.animate(frames, { duration: o.dur ?? 800, easing: o.ease ?? EASE });
      });
    },
    show(el, o = {}) {
      const tf = `translate(${o.x || 0}px,${o.y ?? 24}px)`;
      A.anim(el, { opacity: 0, transform: tf }, { opacity: 1, transform: 'translate(0px,0px)' }, o);
    },
    fade(el, o = {}) { A.anim(el, { opacity: 0 }, { opacity: 1 }, o); },
    lines(root, o = {}) {
      $$(root, '.in').forEach((el, i) => A.anim(el,
        { transform: 'translateY(112%)', opacity: 0 },
        { transform: 'translateY(0%)', opacity: 1 },
        { dur: o.dur ?? 900, delay: (o.delay || 0) + i * (o.stagger ?? 120), ease: o.ease }));
    },
    draw(path, o = {}) {
      const len = path.getTotalLength() + 2;
      path.style.strokeDasharray = `${len} ${len + 30}`;
      path.style.strokeDashoffset = len + 12;
      path.style.opacity = 1;
      A.anim(path, { strokeDashoffset: len + 12 }, { strokeDashoffset: 0 }, o);
      return len;
    },
    tween(dur, fn, o = {}) {
      const ease = o.ease || E.out;
      A.at(o.delay || 0, () => {
        if (instant) { fn(1, 1); return; }
        const t0 = performance.now();
        fn(ease(0), 0);
        const step = now => {
          if (g !== GEN) return;
          const t = clamp((now - t0) / dur, 0, 1);
          fn(ease(t), t);
          if (t < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      });
    },
    loop(fn, delay = 0) {            // idle loop: only for the beat on screen
      if (!current) return;
      A.at(delay, () => {
        let last = performance.now();
        const step = now => {
          if (g !== GEN) return;
          const dt = clamp((now - last) / 1000, 0, .05); last = Math.max(last, now);
          fn(dt);
          requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      });
    },
    every(ms, fn, delay = 0) {       // idle repeat: only for the beat on screen
      if (!current) return;
      const tick = () => { if (g !== GEN) return; fn(); const id = setTimeout(() => { timers.delete(id); tick(); }, ms); timers.add(id); };
      A.at(delay, () => { if (instant) { const id = setTimeout(() => { timers.delete(id); tick(); }, 400); timers.add(id); } else tick(); });
    },
    flush() {
      while (q.length) {
        let bi = 0;
        for (let i = 1; i < q.length; i++) if (q[i].t < q[bi].t || (q[i].t === q[bi].t && q[i].s < q[bi].s)) bi = i;
        const it = q.splice(bi, 1)[0];
        vnow = it.t;
        it.fn();
      }
      vnow = 0;
    }
  };
  return A;
}

/* ================================================================
   The Buddy mark: rounded-square chip, three pins per side, two eyes.
   ================================================================ */
function buddy(o = {}) {
  const pins = [];
  const P = [70, 100, 130];
  P.forEach((c, i) => pins.push(`<rect class="bd-pin" data-d="t" data-o="${i}" x="${c - 8.5}" y="17" width="17" height="31" rx="8.5"/>`));
  P.forEach((c, i) => pins.push(`<rect class="bd-pin" data-d="r" data-o="${3 + i}" x="152" y="${c - 8.5}" width="31" height="17" rx="8.5"/>`));
  P.slice().reverse().forEach((c, i) => pins.push(`<rect class="bd-pin" data-d="b" data-o="${6 + i}" x="${c - 8.5}" y="152" width="17" height="31" rx="8.5"/>`));
  P.slice().reverse().forEach((c, i) => pins.push(`<rect class="bd-pin" data-d="l" data-o="${9 + i}" x="17" y="${c - 8.5}" width="31" height="17" rx="8.5"/>`));
  const pos = o.size ? `x="${o.x}" y="${o.y}" width="${o.size}" height="${o.size}"` : '';
  const st = o.bd != null ? ` style="--bd:${o.bd}s"` : '';
  return `<svg class="buddy ${o.cls || ''}" ${pos} viewBox="0 0 200 200"${st} aria-hidden="true">` +
    pins.join('') +
    `<rect class="bd-body" x="36" y="36" width="128" height="128" rx="38"/>` +
    `<ellipse class="bd-eye" cx="80" cy="96" rx="12" ry="18"/><ellipse class="bd-eye" cx="120" cy="96" rx="12" ry="18"/>` +
    `</svg>`;
}
// Draw the mark in: body grows, pins slide out clockwise, eyes open.
function markIn(A, svg, d = 0, k = 1) {
  const OFF = { t: 'translate(0px,26px)', b: 'translate(0px,-26px)', l: 'translate(26px,0px)', r: 'translate(-26px,0px)' };
  A.anim($(svg, '.bd-body'), { opacity: 0, transform: 'scale(.55)' }, { opacity: 1, transform: 'scale(1)' }, { delay: d, dur: 850 * k });
  $$(svg, '.bd-pin').forEach(p => A.anim(p, { opacity: 0, transform: OFF[p.dataset.d] }, { opacity: 1, transform: 'translate(0px,0px)' },
    { delay: d + (360 + (+p.dataset.o) * 48) * k, dur: 560 * k }));
  $$(svg, '.bd-eye').forEach(e => {
    A.anim(e, { opacity: 0 }, { opacity: 1 }, { delay: d + 1000 * k, dur: 160 });
    A.anim(e, { transform: 'scaleY(.12)' }, { transform: 'scaleY(1)' }, { delay: d + 1200 * k, dur: 380 });
  });
  return d + 1600 * k;
}
function blinkOnce(A, svg, d) {
  $$(svg, '.bd-eye').forEach(e => A.kf(e, [{ transform: 'scaleY(1)' }, { transform: 'scaleY(.1)', offset: .45 }, { transform: 'scaleY(1)' }],
    { delay: d, dur: 300, ease: 'ease-in-out' }));
}

/* ================================================================
   Icons (flat, filled)
   ================================================================ */
const DK = '#1F1F23';
const IC = {
  check: (s = 48) => `<svg class="ck" width="${s}" height="${s}" viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#12A150"/><path d="M14 24.8l6.6 6.6L34.2 17.6" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  warn: (s = 84) => `<svg width="${s}" height="${s}" viewBox="0 0 48 48"><path d="M24 8.5L41.5 38.5H6.5Z" fill="#F5A524" stroke="#F5A524" stroke-width="7" stroke-linejoin="round"/><rect x="21.7" y="17.5" width="4.6" height="12.5" rx="2.3" fill="#0E0E10"/><circle cx="24" cy="34.6" r="2.8" fill="#0E0E10"/></svg>`,
  env: () => `<svg width="76" height="58" viewBox="0 0 76 58"><rect width="76" height="58" rx="11" fill="#2563FF"/><path d="M13 15L38 34L63 15" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  sparkles: () => {
    const sp = (cx, cy, r) => `M${cx} ${cy - r}Q${cx + r * .15} ${cy - r * .15} ${cx + r} ${cy}Q${cx + r * .15} ${cy + r * .15} ${cx} ${cy + r}Q${cx - r * .15} ${cy + r * .15} ${cx - r} ${cy}Q${cx - r * .15} ${cy - r * .15} ${cx} ${cy - r}Z`;
    return `<svg width="124" height="124" viewBox="0 0 120 120"><path d="${sp(50, 66, 42)}" fill="${DK}"/><path d="${sp(92, 28, 17)}" fill="${DK}"/><path d="${sp(96, 82, 10)}" fill="${DK}"/></svg>`;
  },
  factory: () => `<svg width="128" height="128" viewBox="0 0 120 120"><rect x="88" y="16" width="16" height="90" rx="3" fill="${DK}"/><path d="M14 106V58L39 42V58L64 42V58L89 42V106Z" fill="${DK}"/><rect x="26" y="70" width="14" height="14" rx="3" fill="#fff"/><rect x="50" y="70" width="14" height="14" rx="3" fill="#fff"/><rect x="74" y="70" width="14" height="14" rx="3" fill="#fff"/></svg>`,
  code: () => `<svg width="124" height="124" viewBox="0 0 120 120"><rect x="8" y="20" width="104" height="80" rx="18" fill="${DK}"/><path d="M45 46L31 60L45 74M75 46L89 60L75 74M66 41L54 79" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  ticket: (s = 84) => `<svg width="${s}" height="${s}" viewBox="0 0 84 84"><path d="M8 20H76A4 4 0 0 1 80 24V34A8 8 0 0 0 80 50V60A4 4 0 0 1 76 64H8A4 4 0 0 1 4 60V50A8 8 0 0 0 4 34V24A4 4 0 0 1 8 20Z" fill="${DK}"/><rect x="22" y="34" width="38" height="5" rx="2.5" fill="#fff"/><rect x="22" y="45" width="26" height="5" rx="2.5" fill="#fff"/></svg>`,
  tech: (s = 84) => `<svg width="${s}" height="${s}" viewBox="0 0 84 84"><path d="M16 82A26 23 0 0 1 68 82Z" fill="${DK}"/><circle cx="42" cy="40" r="14" fill="${DK}"/><path d="M24 34A18 18 0 0 1 60 34Z" fill="#6B6B70"/><rect x="20" y="31" width="44" height="6" rx="3" fill="#6B6B70"/></svg>`,
  servo: (s = 46) => `<svg width="${s}" height="${s}" viewBox="0 0 48 48"><rect x="4" y="18" width="40" height="24" rx="6" fill="#6B6B70"/><circle cx="16" cy="18" r="9" fill="${DK}"/><rect x="6" y="13" width="26" height="9" rx="4.5" fill="${DK}"/></svg>`,
  play: () => `<svg width="30" height="30" viewBox="0 0 24 24"><path d="M7 5v14l11-7z" fill="#2563FF" stroke="#2563FF" stroke-width="3" stroke-linejoin="round"/></svg>`,
  pin: () => `<path d="M14 0C6.3 0 0 6.1 0 13.7 0 23.6 14 40 14 40S28 23.6 28 13.7C28 6.1 21.7 0 14 0Z" fill="${DK}"/><circle cx="14" cy="13.5" r="5.5" fill="#E2E2DC"/>`,
  satellite: () => `
    <rect x="-40" y="-3" width="80" height="6" fill="${DK}"/>

const SCENES = [SC1, SC2, SC3, SC4, SC5, SC6, SC7, SC8, SC9];

/* ================================================================
   State machine: (scene, beat)
   ================================================================ */
let cur = { s: 1, b: 1 };
let section = null;
let auto = false, autoTimer = 0, hudHidden = false;

function render(s, b, mode) {             // mode: 'play' | 'snap' | 'debug'
  cancelAll();
  clearTimeout(autoTimer);
  const SC = SCENES[s - 1];
  b = clamp(b, 1, SC.beats.length);
  if (mode === 'debug') $$(scenesEl, '.scene.leaving').forEach(n => n.remove());
  if (!section || +section.dataset.s !== s) {
    $$(scenesEl, '.scene.leaving').forEach(n => n.remove());   // at most two scenes on screen
    if (section) {
      if (mode === 'debug') section.remove();
      else {
        const old = section, op = getComputedStyle(old).opacity;
        old.getAnimations().forEach(a => a.cancel());
        old.classList.add('leaving');
        old.style.opacity = 0;
        old.animate([{ opacity: op }, { opacity: 0 }], { duration: 450, easing: 'ease-in-out' }).onfinish = () => old.remove();
      }
    }
    section = document.createElement('section');
    section.className = 'scene';
    section.dataset.s = s;
    scenesEl.appendChild(section);
    if (mode !== 'debug') section.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 500, easing: 'ease-in-out' });
  } else if (mode === 'debug') {
    section.getAnimations().forEach(a => a.cancel());
  }
  section.innerHTML = SC.html();
  for (const k of Object.keys(section)) if (k[0] === '_') delete section[k];   // drop cached element refs
  for (let i = 1; i < b; i++) {             // earlier beats: snap to their end state
    const A = makeA(true, false);
    SC.beats[i - 1](section, A);
    A.flush();
  }
  const A = makeA(mode !== 'play', true);   // this beat: play it, or snap it
  SC.beats[b - 1](section, A);
  if (A.instant) A.flush();
  cur = { s, b };
  updateHud();
  if (location.hash !== '#' + s) history.replaceState(null, '', location.pathname + location.search + '#' + s);
  scheduleAuto();
}
function next() {
  const SC = SCENES[cur.s - 1];
  if (cur.b < SC.beats.length) render(cur.s, cur.b + 1, 'play');
  else if (cur.s < SCENES.length) render(cur.s + 1, 1, 'play');
}
function prev() {
  if (cur.b > 1) render(cur.s, cur.b - 1, 'snap');
  else if (cur.s > 1) render(cur.s - 1, SCENES[cur.s - 2].beats.length, 'snap');
}
function scheduleAuto() {
  clearTimeout(autoTimer);
  if (!auto) return;
  const d = SCENES[cur.s - 1].dur[cur.b - 1];
  if (!d) return;                            // last beat holds
  autoTimer = setTimeout(() => { if (auto) next(); }, d);
}
function setAuto(on) {
  auto = on;
  updateHud();
  scheduleAuto();
}
function updateHud() {
  if (!hud.children.length) hud.innerHTML = SCENES.map(() => '<i></i>').join('');
  Array.from(hud.children).forEach((d, i) => d.classList.toggle('on', i === cur.s - 1));
  stage.classList.toggle('nohud', hudHidden || auto);
}
function toggleFS() {
  const d = document, el = d.documentElement;
  if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
}

addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === 'ArrowRight' || k === ' ' || k === 'Spacebar' || k === 'PageDown' || k === 'Enter') { e.preventDefault(); next(); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); prev(); }
  else if (/^[1-9]$/.test(k)) { e.preventDefault(); render(+k, 1, 'play'); }
  else if (k === 'Home') { e.preventDefault(); render(1, 1, 'play'); }
  else if (k === 'a' || k === 'A') setAuto(!auto);
  else if (k === 'f' || k === 'F') toggleFS();
  else if (k === 'h' || k === 'H') { hudHidden = !hudHidden; updateHud(); }
});
addEventListener('click', e => { if (e.button === 0) next(); });
addEventListener('hashchange', () => {
  const n = parseInt(location.hash.slice(1), 10);
  if (n >= 1 && n <= 9 && n !== cur.s) render(n, 1, 'play');
});

window.__pitch = {
  go(s, b = 1) { render(clamp(s | 0, 1, 9), b | 0 || 1, 'debug'); return this.state(); },
  state() { return { scene: cur.s, beat: cur.b, beats: SCENES[cur.s - 1].beats.length, auto, name: SCENES[cur.s - 1].name }; }
};

const h0 = parseInt(location.hash.slice(1), 10);
auto = new URLSearchParams(location.search).get('auto') === '1';
render(h0 >= 1 && h0 <= 9 ? h0 : 1, 1, 'play');
})();
