<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hardware Buddy</title>
<style>
:root{
  --bg:#FFF8EE; --ink:#1F1B2E; --mute:#6E6A7C; --faint:#C9C1B4; --line:#E8DECF;
  --v:#6D5DF6; --v2:#9A8FFF; --vd:#5546E0;
  --g:#22B07D; --gd:#0F7A54; --g2:#DDF4EA; --r:#F0556A; --rd:#C8243C; --r2:#FDE3E6; --a:#F7B23B; --a2:#FDF0D5;
  --round: ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,sans-serif;
  --text: -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --mono: ui-monospace,"SF Mono",Menlo,monospace;
  --spring: cubic-bezier(.3,1.3,.6,1);
}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--bg);overflow:hidden;font-family:var(--text);color:var(--ink)}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity 220ms ease,visibility 0s linear 220ms}
.scene.on{opacity:1;visibility:visible;transition:opacity 320ms ease 180ms,visibility 0s}
#stage.instant .scene,#stage.instant .scene *{transition:none!important}
.art{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible}
.abs{position:absolute}
.rnd{font-family:var(--round);font-weight:700}
.mono{font-family:var(--mono)}
.tb{transform-box:fill-box;transform-origin:center}
.ctr{left:0;right:0;text-align:center}
.mute{color:var(--mute)}
svg text{font-family:var(--round);font-weight:700}
svg text.t{font-family:var(--text);font-weight:600}
.card{background:#fff;border-radius:34px;box-shadow:0 18px 40px rgba(31,27,46,.09),0 3px 8px rgba(31,27,46,.06);transition:box-shadow .4s ease}
.card.pulse{animation:okp 1.3s ease-in-out infinite}
@keyframes okp{0%,100%{box-shadow:0 0 0 0 rgba(34,176,125,0),0 18px 40px rgba(31,27,46,.09)}50%{box-shadow:0 0 0 9px rgba(34,176,125,.45),0 18px 40px rgba(31,27,46,.09)}}
.card.ok{box-shadow:0 0 0 5px var(--g),0 18px 40px rgba(31,27,46,.09),0 3px 8px rgba(31,27,46,.06)}
.ctitle{font-family:var(--round);font-weight:700;font-size:58px;line-height:1.1;letter-spacing:-.01em}
.li{display:flex;align-items:flex-start;gap:18px;font-size:38px;line-height:1.22;font-weight:500;color:var(--ink)}
.li i{flex:none;width:14px;height:14px;border-radius:7px;background:var(--mute);margin-top:19px}
.res{display:flex;align-items:center;gap:18px;font-family:var(--round);font-weight:700;font-size:42px;color:var(--gd)}
.res svg{flex:none}
.term{background:#1F1B2E;border-radius:30px;color:#FFF8EE;font-family:var(--mono);box-shadow:0 18px 40px rgba(31,27,46,.16)}
.term .hd{display:flex;gap:12px;padding:24px 30px 6px}
.term .hd b{width:14px;height:14px;border-radius:7px;background:#4A4560}
.tl{display:flex;align-items:center;gap:22px;font-size:36px;padding:10px 34px;color:#8F8AA3;transition:color .3s}
.tl.done{color:#FFF8EE}
.tl .bx{position:relative;width:46px;height:46px;flex:none}
.tl .bx:before{content:"";position:absolute;inset:3px;border-radius:50%;border:4px solid #4A4560}
.tl .bx svg{position:absolute;inset:0}
/* Buddy character */
.buddy .b-float{animation:bfloat 3.8s ease-in-out infinite}
@keyframes bfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3.5px)}}
.buddy .b-open{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite;transition:opacity .2s ease}
@keyframes blink{0%,90%,96%,100%{transform:scaleY(1)}93%{transform:scaleY(.08)}}
.buddy .b-eyes{transition:transform .5s var(--spring)}
.buddy[data-look=up] .b-eyes{transform:translate(4px,-8px)}
.buddy[data-look=right] .b-eyes{transform:translate(6px,0)}
.buddy[data-look=down] .b-eyes{transform:translate(0,4px)}
.buddy .x{opacity:0;transition:opacity .22s ease}
.buddy[data-e=content] .m-smile,
.buddy[data-e=worried] .m-wavy,.buddy[data-e=worried] .b-brows,
.buddy[data-e=sad] .m-frown,.buddy[data-e=sad] .b-brows,
.buddy[data-e=happy] .m-smile,.buddy[data-e=happy] .b-happy,
.buddy[data-e=joy] .m-open,.buddy[data-e=joy] .b-happy,
.buddy[data-e=proud] .m-open,
.buddy[data-e=sleep] .b-closed,.buddy[data-e=sleep] .m-flat{opacity:1}
.buddy[data-e=happy] .b-open,.buddy[data-e=joy] .b-open,.buddy[data-e=sleep] .b-open{opacity:0}
.buddy[data-e=worried] .b-open,.buddy[data-e=sad] .b-open{animation-duration:3.4s}
.bandL{transform-box:fill-box;transform-origin:0 50%}
#dl6.gone #dlt6{text-decoration:line-through;text-decoration-thickness:4px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="sh" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1F1B2E" flood-opacity=".10"/></filter>
</defs></svg>
<div id="stage">
  <section class="scene" id="s1"></section>
  <section class="scene" id="s2"></section>
  <section class="scene" id="s3"></section>
  <section class="scene" id="s4"></section>
  <section class="scene" id="s5"></section>
  <section class="scene" id="s6"></section>
  <section class="scene" id="s7"></section>
  <section class="scene" id="s8"></section>
</div>
<script>
"use strict";
/* ============ palette, easing, helpers ============ */
const C={ink:'#1F1B2E',mute:'#6E6A7C',faint:'#C9C1B4',line:'#E8DECF',bg:'#FFF8EE',v:'#6D5DF6',v2:'#9A8FFF',vd:'#5546E0',
  g:'#22B07D',gd:'#0F7A54',g2:'#DDF4EA',r:'#F0556A',r2:'#FDE3E6',a:'#F7B23B',a2:'#FDF0D5',kraft:'#F3E3C7',sky:'#D3E8F6',skyd:'#8CC6EC'};
const EASE='cubic-bezier(.22,.8,.3,1)', SPRING='cubic-bezier(.3,1.3,.6,1)', INOUT='cubic-bezier(.45,0,.25,1)', LIN='linear';
const ST=`stroke="${C.ink}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"`;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=t=>t*t*(3-2*t);
const eOut=t=>1-Math.pow(1-t,3);
const eInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const D2R=Math.PI/180;

/* ============ the Buddy mark (logo + character) ============ */
function buddy(o){
  const s=(o.size||120)/120;
  let pins='';
  for(const p of [-24,0,24]){
    pins+=`<rect class="tb" x="${p-5.5}" y="-61" width="11" height="20" rx="5.5"/><rect class="tb" x="${p-5.5}" y="41" width="11" height="20" rx="5.5"/>`+
          `<rect class="tb" x="-61" y="${p-5.5}" width="20" height="11" rx="5.5"/><rect class="tb" x="41" y="${p-5.5}" width="20" height="11" rx="5.5"/>`;
  }
  return `<g transform="translate(${o.x} ${o.y}) scale(${s})"><g class="buddy" ${o.id?`id="${o.id}"`:''} data-e="${o.e||'content'}" data-look="${o.look||''}"><g class="b-jump tb"><g class="b-float">
  <g class="b-pins" fill="${C.vd}">${pins}</g>
  <rect class="b-body" x="-46" y="-46" width="92" height="92" rx="27" fill="${C.v}"/>
  <path class="b-hi" d="M-31 -35 H-12" stroke="${C.v2}" stroke-width="6" stroke-linecap="round"/>
  ${o.draw?`<rect class="b-outline" x="-46" y="-46" width="92" height="92" rx="27" fill="none" stroke="${C.v}" stroke-width="5" pathLength="1" stroke-dasharray="1 1"/>`:''}
  <g class="b-face" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <g class="b-eyes">
      <g class="b-open" stroke="none" fill="#fff"><ellipse cx="-16" cy="-6" rx="8.5" ry="12.5"/><ellipse cx="16" cy="-6" rx="8.5" ry="12.5"/></g>
      <path class="x b-happy" d="M-25 -3 Q-16 -17 -7 -3 M7 -3 Q16 -17 25 -3"/>
      <path class="x b-closed" d="M-25 -6 Q-16 2 -7 -6 M7 -6 Q16 2 25 -6"/>
    </g>
    <path class="x b-brows" d="M-27 -22 L-11 -28 M11 -28 L27 -22"/>
    <path class="x m-smile" d="M-10 18 Q0 26 10 18"/>
    <path class="x m-open" d="M-12 16 Q0 32 12 16 Z" fill="#fff"/>
    <path class="x m-wavy" d="M-12 22 Q-6 17 0 22 Q6 27 12 22"/>
    <path class="x m-frown" d="M-10 25 Q0 17 10 25"/>
    <path class="x m-flat" d="M-7 21 H7"/>
  </g></g></g></g></g>`;
}

/* ============ icons (inline SVG, centred on 0,0) ============ */
const I={
  check:(r=26)=>`<circle r="${r}" fill="${C.g}"/><path d="M${-r*.42} ${r*.02} L${-r*.12} ${r*.32} L${r*.44} ${-r*.3}" fill="none" stroke="#fff" stroke-width="${r*.2}" stroke-linecap="round" stroke-linejoin="round"/>`,
  warn:(col=C.r)=>`<path d="M0 -30 L32 25 H-32 Z" fill="${col}" stroke="${col}" stroke-width="12" stroke-linejoin="round"/><path d="M0 -10 V5" stroke="#fff" stroke-width="7" stroke-linecap="round"/><circle cy="16" r="4.5" fill="#fff"/>`,
  env:()=>`<rect x="-36" y="-25" width="72" height="50" rx="9" fill="#fff" ${ST}/><path d="M-29 -17 L0 5 L29 -17" fill="none" ${ST}/>`,
  factory:()=>`<path d="M-62 52 V-4 L-30 -26 V-4 L2 -26 V-4 L34 -26 V-54 H54 V52 Z" fill="#fff" ${ST}/>
    <rect x="-48" y="12" width="20" height="18" rx="5" fill="${C.sky}" ${ST}/><rect x="-16" y="12" width="20" height="18" rx="5" fill="${C.sky}" ${ST}/><rect x="16" y="12" width="20" height="18" rx="5" fill="${C.sky}" ${ST}/>`,
  chat:()=>`<path d="M-48 -40 H48 A18 18 0 0 1 66 -22 V16 A18 18 0 0 1 48 34 H-4 L-30 56 V34 H-48 A18 18 0 0 1 -66 16 V-22 A18 18 0 0 1 -48 -40 Z" fill="#fff" ${ST}/>
    <circle cx="-26" cy="-3" r="7.5" fill="${C.ink}"/><circle cy="-3" r="7.5" fill="${C.ink}"/><circle cx="26" cy="-3" r="7.5" fill="${C.ink}"/>`,
  code:()=>`<rect x="-68" y="-50" width="136" height="100" rx="16" fill="#fff" ${ST}/><path d="M-68 -24 H68" ${ST}/>
    <circle cx="-50" cy="-37" r="4.5" fill="${C.mute}"/><circle cx="-36" cy="-37" r="4.5" fill="${C.mute}"/><circle cx="-22" cy="-37" r="4.5" fill="${C.mute}"/>
    <path d="M-22 -4 L-40 12 L-22 28 M22 -4 L40 12 L22 28 M9 -10 L-9 34" fill="none" stroke="${C.ink}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`,
  cloud:(fill='#fff')=>{const sh=`<circle cx="-52" cy="12" r="36"/><circle cx="0" cy="-14" r="50"/><circle cx="52" cy="10" r="38"/><rect x="-52" y="0" width="104" height="48"/>`;
    return `<g stroke="${C.ink}" stroke-width="8" fill="${fill}">${sh}</g><g fill="${fill}">${sh}</g>`;},
  sat:()=>`<path d="M-54 0 H-26 M26 0 H54" ${ST}/>
    <rect x="-112" y="-21" width="58" height="42" rx="7" fill="${C.sky}" ${ST}/><path d="M-83 -21 V21" ${ST}/>
    <rect x="54" y="-21" width="58" height="42" rx="7" fill="${C.sky}" ${ST}/><path d="M83 -21 V21" ${ST}/>
    <rect x="-26" y="-26" width="52" height="52" rx="13" fill="#fff" ${ST}/><path d="M0 26 V38 M-14 50 Q0 34 14 50" fill="none" ${ST}/>`,
  wrench:()=>`<g transform="rotate(45)"><rect x="-8" y="-6" width="16" height="50" rx="8" fill="${C.ink}"/><circle cy="-18" r="20" fill="${C.ink}"/><rect x="-7.5" y="-46" width="15" height="28" rx="4" fill="#fff"/></g>`,
  ticket:()=>`<path d="M-44 -28 H44 V-11 A11 11 0 0 0 44 11 V28 H-44 V11 A11 11 0 0 0 -44 -11 Z" fill="#fff" ${ST}/><path d="M16 -20 V20" stroke="${C.ink}" stroke-width="4" stroke-dasharray="1 9" stroke-linecap="round"/><path d="M-28 -8 H2 M-28 8 H-6" ${ST}/>`,
  gear:()=>{let t='';for(let i=0;i<8;i++)t+=`<rect x="-7" y="-33" width="14" height="16" rx="3" fill="${C.ink}" transform="rotate(${i*45})"/>`;
    return t+`<circle r="24" fill="${C.ink}"/><circle r="9" fill="#fff"/>`;},
  pin:(col=C.ink)=>`<path d="M0 0 C-8 -14 -26 -30 -26 -52 A26 26 0 0 1 26 -52 C26 -30 8 -14 0 0 Z" fill="${col}"/><circle cy="-52" r="9.5" fill="#fff"/>`,
  play:(col=C.v)=>`<path d="M-9 -14 L15 0 L-9 14 Z" fill="${col}" stroke="${col}" stroke-width="7" stroke-linejoin="round"/>`,
  cross:(col='#fff',s=11)=>`<path d="M${-s} ${-s} L${s} ${s} M${s} ${-s} L${-s} ${s}" stroke="${col}" stroke-width="6" stroke-linecap="round"/>`,
};
const svgIcon=(inner,size,vb=70)=>`<svg width="${size}" height="${size}" viewBox="${-vb/2} ${-vb/2} ${vb} ${vb}" style="overflow:visible">${inner}</svg>`;
/* pill: <g class="pill" data-cx|data-x data-cy data-h data-fs> rect, optional g.pi icon, text */
function pill(o){
  return `<g class="pill${o.cls?' '+o.cls:''}" ${o.id?`id="${o.id}" style="opacity:0"`:''} ${o.cx!=null?`data-cx="${o.cx}"`:`data-x="${o.x}"`} data-cy="${o.cy}" data-h="${o.h||72}" data-fs="${o.fs||36}">
    <rect fill="${o.fill||'#fff'}" ${o.stroke?`stroke="${o.stroke}" stroke-width="4"`:''} ${o.shadow?'filter="url(#sh)"':''}/>
    ${o.icon?`<g class="pi">${o.icon}</g>`:''}
    <text fill="${o.color||C.ink}" font-size="${o.fs||36}" ${o.mono?'class="t"':''}>${o.text}</text></g>`;
}
function fitPills(root){
  root.querySelectorAll('g.pill').forEach(g=>{
    const r=g.querySelector('rect'), t=g.querySelector('text'), ic=g.querySelector('.pi');
    const h=+g.dataset.h, fs=+g.dataset.fs, cy=+g.dataset.cy, pad=h*.42, iw=ic?h*.62:0, gap=ic?14:0;
    const tw=t.getComputedTextLength(); const w=pad*2+iw+gap+tw;
    const x0=g.dataset.cx!=null?(+g.dataset.cx)-w/2:+g.dataset.x;
    r.setAttribute('x',x0);r.setAttribute('y',cy-h/2);r.setAttribute('width',w);r.setAttribute('height',h);r.setAttribute('rx',h/2);
    if(ic) ic.setAttribute('transform',`translate(${x0+pad+iw/2} ${cy})`);
    t.setAttribute('x',x0+pad+iw+gap);t.setAttribute('y',cy+fs*.35);
  });
}

/* ============ beat runtime: everything tracked so it can be cancelled ============ */
const RUN={timers:[],ticks:[],anims:[],named:{}};
let rafOn=false, carry={};
function kick(){if(!rafOn){rafOn=true;requestAnimationFrame(frame);}}
function frame(now){RUN.ticks=RUN.ticks.filter(f=>f(now));if(RUN.ticks.length)requestAnimationFrame(frame);else rafOn=false;}
function mkCtx(sec,si,o){
  const base=o.base||0, snap=!!o.snap, final=!!o.final;
  const qa=s=>typeof s==='string'?[...sec.querySelectorAll(s)]:(Array.isArray(s)?s:[s]);
  const c={snap,final,sec,carry,q:s=>typeof s==='string'?sec.querySelector(s):s,qa};
  c.anim=(t,kf,p={})=>{let out;qa(t).forEach((el,i)=>{const it=p.it??1;
    const a=el.animate(kf,{duration:p.d??600,delay:base+(p.at??0)+(p.st??0)*i,easing:p.e??EASE,fill:p.fill||'both',iterations:it,direction:p.dir||'normal'});
    RUN.anims.push({a,si});if(p.name)RUN.named[p.name]=a;if(snap&&it!==Infinity)a.finish();out=a;});return out;};
  c.fade=(t,at=0,d=500,dy=0)=>c.anim(t,[{opacity:0,transform:`translateY(${dy}px)`},{opacity:1,transform:'translateY(0px)'}],{at,d});
  c.pop=(t,at=0,d=520,st=0)=>c.anim(t,[{opacity:0,transform:'scale(.5)'},{opacity:1,transform:'scale(1)'}],{at,d,e:SPRING,st});
  c.bump=(t,at=0,k=1.06)=>c.anim(t,[{transform:'scale(1)'},{transform:`scale(${k})`},{transform:'scale(1)'}],{at,d:520,e:'ease-in-out'});
  c.hop=(t,at=0,h=12)=>c.anim(t,[{transform:'translateY(0px)'},{transform:`translateY(${-h}px)`,offset:.4},{transform:'translateY(0px)'}],{at,d:560,e:'ease-in-out'});
  c.at=(ms,fn)=>{if(snap)fn();else RUN.timers.push(setTimeout(fn,base+ms));};
  c.tween=(at,d,fn,ease=eOut)=>{if(snap){fn(1,1);return;}fn(ease(0),0);const t0=performance.now()+base+at;
    RUN.ticks.push(now=>{if(now<t0)return true;const u=clamp((now-t0)/d);fn(ease(u),u);return u<1;});kick();};
  c.loop=fn=>{const t0=performance.now();fn(0);if(!final)return;RUN.ticks.push(now=>{fn(now-t0);return true;});kick();};
  c.stop=name=>{const a=RUN.named[name];if(a){a.cancel();delete RUN.named[name];}};
  c.expr=(sel,e,ms=0)=>c.at(ms,()=>qa(sel).forEach(el=>el.dataset.e=e));
  c.look=(sel,l,ms=0)=>c.at(ms,()=>qa(sel).forEach(el=>el.dataset.look=l));
  c.cls=(sel,cl,on,ms=0)=>c.at(ms,()=>qa(sel).forEach(el=>el.classList.toggle(cl,on)));
  c.attr=(sel,k,v,ms=0)=>c.at(ms,()=>qa(sel).forEach(el=>el.setAttribute(k,v)));
  return c;
}
const SC=[];

/* ============ Scene 1 · Downtime ============ */
const S1={L1:250,L2:230,SX:150,SY:660,T:4600,
  K:[[0,-250,480,0],[.12,-250,615,0],[.2,-250,615,1],[.32,-250,470,1],[.55,-70,490,1],[.64,-70,600,1],[.7,-70,600,0],[.8,-70,490,0],[1,-250,480,0]]};
function ik1(x,y){
  const {L1,L2,SX,SY}=S1, dx=x-SX, dy=y-SY;
  const d=clamp(Math.hypot(dx,dy),Math.abs(L1-L2)+1,L1+L2-1);
  const q2=Math.acos(clamp((d*d-L1*L1-L2*L2)/(2*L1*L2),-1,1));
  const k=Math.atan2(L2*Math.sin(q2),L1+L2*Math.cos(q2));
  const t1=(Math.atan2(dy,dx)+k)/D2R, t2=-q2/D2R;
  return [t1,t2,90-(t1+t2)];
}
function pose1(p){
  const K=S1.K;let i=0;while(i<K.length-2&&p>K[i+1][0])i++;
  const a=K[i],b=K[i+1],u=sstep(clamp((p-a[0])/(b[0]-a[0])));
  let y=lerp(a[2],b[2],u);if(Math.abs(b[1]-a[1])>50)y-=50*Math.sin(Math.PI*u);
  return {x:lerp(a[1],b[1],u),y,g:lerp(a[3],b[3],u)};
}
function fk1(a){
  const t1=a[0]*D2R,t12=(a[0]+a[1])*D2R,t3=(a[0]+a[1]+a[2])*D2R;
  const wx=S1.SX+S1.L1*Math.cos(t1)+S1.L2*Math.cos(t12), wy=S1.SY+S1.L1*Math.sin(t1)+S1.L2*Math.sin(t12);
  return {x:wx+60*Math.cos(t3),y:wy+60*Math.sin(t3),r:a[0]+a[1]+a[2]-90};
}
const box1=()=>`<rect x="-30" y="-25" width="60" height="50" rx="8" fill="${C.kraft}" ${ST}/><path d="M-30 -10 H30" stroke="${C.ink}" stroke-width="3" opacity=".22"/><rect x="-7" y="-25" width="14" height="15" fill="${C.ink}" opacity=".14"/>`;
function world1(c){
  const j=[...c.sec.querySelectorAll('#j1,#j2,#j3,#fa,#fb')], bx=[0,1,2,3].map(k=>c.q('#bx'+k)), fall=c.q('#fall1'), belt=c.q('#belt1');
  const put=(el,x,y,r=0,o=1)=>{el.setAttribute('transform',`translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${r.toFixed(2)})`);el.setAttribute('opacity',o.toFixed(3));};
  return (P,a,g,carried,frozen)=>{
    const p=P-Math.floor(P), cyc=Math.floor(P), s=130*sstep(clamp((p-.32)/.6));
    belt.setAttribute('stroke-dashoffset',(-((cyc*130+s)%34)).toFixed(1));
    j[0].setAttribute('transform',`translate(${S1.SX} ${S1.SY}) rotate(${a[0].toFixed(2)})`);
    j[1].setAttribute('transform',`translate(${S1.L1} 0) rotate(${a[1].toFixed(2)})`);
    j[2].setAttribute('transform',`translate(${S1.L2} 0) rotate(${a[2].toFixed(2)})`);
    const gap=46-10*g;j[3].setAttribute('transform',`translate(0 ${-gap})`);j[4].setAttribute('transform',`translate(0 ${gap})`);
    for(let k=1;k<4;k++){const x=-250-130*k+s;put(bx[k],x,675,0,clamp((x+600)/80));}
    const held=carried??(p>=.2&&p<.68);
    if(held){const f=fk1(a);put(bx[0],f.x,f.y,f.r);}

/* ============ engine: state machine of (scene, beat) ============ */
const BEATS=[[5000],[4000,4000,3500],[5000],[3000,3000,4000],[2500,3500,3500],[3000,3000],[4000],[3500,null]];
const N=BEATS.length;
const stage=document.getElementById('stage'), secs=[...document.querySelectorAll('.scene')];
let cur={s:-1,b:0}, auto=false, autoT=null, lastBase=0;
function cancelRun(s){
  RUN.timers.forEach(clearTimeout);RUN.timers=[];RUN.ticks=[];
  RUN.anims.forEach(({a,si})=>{try{if(si===s)a.cancel();else a.pause();}catch(e){}});
  RUN.anims=[];RUN.named={};
}
function render(s,b,mode,instant){
  const changed=s!==cur.s;
  if(instant)stage.classList.add('instant');
  cancelRun(s);
  if(changed)carry={};
  const sec=secs[s];
  sec.innerHTML=SC[s].html();
  fitPills(sec);
  for(let i=0;i<b;i++)SC[s].beats[i](mkCtx(sec,s,{snap:true,final:false}));
  lastBase=(changed&&!instant&&mode==='play')?200:0;
  SC[s].beats[b](mkCtx(sec,s,{snap:mode==='snap',final:true,base:lastBase}));
  if(changed){
    secs.forEach((el,i)=>el.classList.toggle('on',i===s));
    try{history.replaceState(null,'',location.pathname+location.search+'#'+(s+1));}catch(e){}
  }
  if(instant){void stage.offsetWidth;stage.classList.remove('instant');}
  cur={s,b};
  schedule();
}
function next(){const n=BEATS[cur.s].length;if(cur.b+1<n)render(cur.s,cur.b+1,'play');else if(cur.s<N-1)render(cur.s+1,0,'play');}
function prev(){if(cur.b>0)render(cur.s,cur.b-1,'snap');else if(cur.s>0)render(cur.s-1,BEATS[cur.s-1].length-1,'snap');}
function schedule(){
  clearTimeout(autoT);autoT=null;if(!auto)return;
  const d=BEATS[cur.s][cur.b];if(d==null)return;
  autoT=setTimeout(()=>{autoT=null;next();},d+lastBase);
}
function toggleFs(){
  const d=document,el=d.documentElement;
  try{if(d.fullscreenElement||d.webkitFullscreenElement)(d.exitFullscreen||d.webkitExitFullscreen).call(d);
  else (el.requestFullscreen||el.webkitRequestFullscreen).call(el);}catch(e){}
}
window.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key;
  if(k==='ArrowRight'||k===' '||k==='PageDown'||k==='Enter'){e.preventDefault();next();}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();prev();}
  else if(/^[1-9]$/.test(k)&&+k<=N){e.preventDefault();render(+k-1,0,'play');}
  else if(k==='Home'){e.preventDefault();render(0,0,'play');}
  else if(k==='a'||k==='A'){auto=!auto;schedule();}
  else if(k==='f'||k==='F'){toggleFs();}
});
window.addEventListener('click',()=>next());
window.addEventListener('hashchange',()=>{const h=parseInt(location.hash.slice(1),10);if(h>=1&&h<=N&&h-1!==cur.s)render(h-1,0,'play');});
function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(${(innerWidth-1920*k)/2}px,${(innerHeight-1080*k)/2}px) scale(${k})`;}
window.addEventListener('resize',fit);fit();
window.__pitch={
  go(s,b){s=clamp(Math.round(s)||1,1,N);b=clamp(Math.round(b)||1,1,BEATS[s-1].length);render(s-1,b-1,'snap',true);return this.state();},
  state(){return {scene:cur.s+1,beat:cur.b+1,beats:cur.s>=0?BEATS[cur.s].length:0,auto};}
};
auto=new URLSearchParams(location.search).get('auto')==='1';
{const h=parseInt(location.hash.slice(1),10);render(h>=1&&h<=N?h-1:0,0,'play',true);}
</script>
