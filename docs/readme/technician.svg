<title id="tt">When it needs hands, a Naïve agent takes the case</title>
<desc id="dd">A live run. The arm jams and the healer parks it. A Naïve agent diagnoses it, plain code emails a technician and stages the spare part, and a person approves the purchase. 38 s to a case, $0.08 per case, 1 human click.</desc>
