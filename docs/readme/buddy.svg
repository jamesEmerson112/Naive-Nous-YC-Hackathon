.f-ink{fill:var(--ink)}.s-ink{stroke:var(--ink)}.f-mute{fill:var(--mute)}.s-mute{stroke:var(--mute)}.f-line{fill:var(--line)}.s-line{stroke:var(--line)}.f-surf{fill:var(--surf)}.s-surf{stroke:var(--surf)}.f-red{fill:var(--red)}.s-red{stroke:var(--red)}.f-vio{fill:var(--vio)}.s-vio{stroke:var(--vio)}.f-grn{fill:var(--grn)}.s-grn{stroke:var(--grn)}.f-pbg{fill:var(--pbg)}.s-pbg{stroke:var(--pbg)}.f-pedge{fill:var(--pedge)}.s-pedge{stroke:var(--pedge)}.f-brand{fill:var(--brand)}.s-brand{stroke:var(--brand)}.f-brand2{fill:var(--brand2)}.s-brand2{stroke:var(--brand2)}.f-paper{fill:var(--paper)}.s-paper{stroke:var(--paper)}.f-pmute{fill:var(--pmute)}.s-pmute{stroke:var(--pmute)}
