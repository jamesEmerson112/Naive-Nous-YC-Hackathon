<title id="tt">Watch the Hardware Buddy demo</title>
<desc id="dd">Video thumbnail: a play button. A real robot arm breaks, fixes its own firmware with no internet, and Naïve agents take care of the rest. Chapters: the problem, it heals itself, when it needs hands, the fleet learns.</desc>
