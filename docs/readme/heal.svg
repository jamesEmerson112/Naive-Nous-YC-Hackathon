<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-labelledby="tt dd">
<title id="tt">The arm heals its own firmware, offline</title>
<desc id="dd">A real bench run with no internet and nobody touching it. At 0 s bad firmware makes the arm fail its job. At 46 s the local healer has rolled the firmware back. At 72 s the job runs clean. At 141 s it has found the root cause.</desc>
