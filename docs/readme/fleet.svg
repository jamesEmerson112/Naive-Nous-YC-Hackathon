<title id="tt">Across the fleet, every fault happens once</title>
<desc id="dd">A live run. A fix fails on one robot. A Naïve agent writes a skill. The gate replays it against past incidents and tries it on a simulated canary, then promotes it to the fleet: 57 s from the agent session, 0 human clicks.</desc>
