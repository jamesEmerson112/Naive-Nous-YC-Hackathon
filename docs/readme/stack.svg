<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="tt dd">
<title id="tt">The stack, from servo to company</title>
<desc id="dd">Three layers. On the bench, offline: the sensor pod and its local healer (qwen3.5:4b, 38 tools), the SO-101 arm with a watchdog, and Hermes running Naïve job cards. Incidents and heal runs go up to Romulus, our cloud, which keeps the labelled incidents, the gate and the work orders. Work orders and failure clusters go up to Naïve agents: the fleet doctor, the technician, and the board with Naïve Skills. Skills and rules come back down through the gate, and new versions go back to the bench.</desc>
