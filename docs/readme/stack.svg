@keyframes d2{0.000%{opacity:0;transform:translate(780px,156px)}41.250%{opacity:0;transform:translate(780px,156px)}42.500%{opacity:1;transform:translate(780px,156px)}50.000%{opacity:1;transform:translate(780px,200px)}52.500%{opacity:0;transform:translate(780px,200px)}100.000%{opacity:0;transform:translate(780px,200px)}}
.d2{animation:d2 8.0s ease-in-out infinite}
@keyframes d3{0.000%{opacity:0;transform:translate(780px,340px)}53.750%{opacity:0;transform:translate(780px,340px)}55.000%{opacity:1;transform:translate(780px,340px)}62.500%{opacity:1;transform:translate(780px,384px)}65.000%{opacity:0;transform:translate(780px,384px)}100.000%{opacity:0;transform:translate(780px,384px)}}
.d3{animation:d3 8.0s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation-delay:-4.6s!important;animation-play-state:paused!important}}
</style>
