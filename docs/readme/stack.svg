.d0{animation:d0 8.0s ease-in-out infinite}
@keyframes d1{0.000%{opacity:0;transform:translate(420px,200px)}16.250%{opacity:0;transform:translate(420px,200px)}17.500%{opacity:1;transform:translate(420px,200px)}25.000%{opacity:1;transform:translate(420px,156px)}27.500%{opacity:0;transform:translate(420px,156px)}100.000%{opacity:0;transform:translate(420px,156px)}}
