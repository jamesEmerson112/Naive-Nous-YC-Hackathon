<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="tt dd">
<title id="tt">Hardware Buddy in numbers</title>
<desc id="dd">141 s: a real arm on bad firmware healed with no internet and no human touch. 10 of 12 heals passed by a 3.3 GB local model on 6 planted faults, 2 runs each, no cloud. 38 heal tools, each with a risk level. 57 s from one failed heal to a tested fix on every arm. $0.08 for a Naïve agent to diagnose a fault, email a technician and stage a part. 1 human click, only to spend money.</desc>
<style>
