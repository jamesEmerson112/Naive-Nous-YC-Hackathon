<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 216" width="1200" height="216" role="img" aria-labelledby="tt dd">
<title id="tt">Hardware Buddy in numbers</title>
<desc id="dd">141 s for a real arm to heal its own firmware, offline. 10 of 12 planted-fault runs fixed by a 3.3 GB local model. 57 s from a Naïve agent session to a fleet-wide fix. $0.08 for a Naïve agent session that diagnoses a fault.</desc>
<style>
.t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.r{font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.fb{transform-box:fill-box;transform-origin:center}

@media (prefers-reduced-motion:reduce){*{animation-delay:-0s!important;animation-play-state:paused!important}}
</style>
