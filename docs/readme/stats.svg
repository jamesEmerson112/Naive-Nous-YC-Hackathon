t-size="15.5" font-weight="550" fill="#6E6A7C" text-anchor="start" >heal tools, each with a risk level</text><text x="828" y="157" class="t" font-size="15.5" font-weight="550" fill="#6E6A7C" text-anchor="start" >from read-only to flash</text><rect class="u2" x="828" y="114" width="54" height="5" rx="2.5" fill="#1F1B2E"/><rect x="30" y="186" width="370" height="142" rx="20" fill="#FFFFFF" stroke="#E8DECF" stroke-width="2"/><defs><clipPath id="c3"><rect x="30" y="196" width="370" height="76"/></clipPath></defs><g clip-path="url(#c3)"><g class="tl n3"><text x="58" y="260" class="r" font-size="54" font-weight="800" fill="#2F8FD8" text-anchor="start" letter-spacing="-1">57 s</text></g></g><text x="60" y="292" class="t" font-size="15.5" font-weight="550" fill="#6E6A7C" text-anchor="start" >from one robot's failed heal to a</text><text x="60" y="313" class="t" font-size="15.5" font-weight="550" fill="#6E6A7C" text-anchor="start" >tested fix on every arm</text><rect class="u3" x="60" y="270" width="54" height="5" rx="2.5" fill="#2F8FD8"/><rect x="414" y="186" width="370" height="142" rx="20" fill="#FFFFFF" stroke="#E8DECF" stroke-width="2"/><defs><clipPath id="c4"><rect x="414" y="196" width="370" height="76"/></clipPath></defs><g clip-path="url(#c4)"><g class="tl n4"><text x="442" y="260" class="r" font-size="54" font-weight="800" fill="#B9770E" text-anchor="start" letter-spacing="-1">$0.08</text></g></g><text x="444" y="292" class="t" font-size="15.5" font-weight="550" fill="#6E6A7C" text-anchor="start" >for a Naïve agent to diagnose a fault,</text><text x="444" y="313" class="t" font-size="15.5" font-weight="550" fill="#6E6A7C" text-anchor="start" >email a technician and stage a part</text><rect class="u4" x="444" y="270" width="54" height="5" rx="2.5" fill="#B9770E"/><rect x="798" y="186" width="370" height="142" rx="20" fill="#FFFFFF" stroke="#E8DECF" stroke-width="2"/><defs><clipPath id="c5"><rect x="798" y="196" width="370" height="76"/></clipPath></defs><g clip-path