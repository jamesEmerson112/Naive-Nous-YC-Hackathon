@keyframes u2{0.000%{transform:scaleX(1);}77.600%{transform:scaleX(1);}80.600%{transform:scaleX(0);}90.400%{transform:scaleX(0);}94.900%{transform:scaleX(1);}100.000%{transform:scaleX(1);}}
