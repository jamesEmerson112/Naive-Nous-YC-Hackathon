.r{font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.fb{transform-box:fill-box;transform-origin:center}
.tl{animation-duration:10s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.2,.9,.3,1.2)}
@keyframes n0{0.000%{transform:translateY(0);}76.000%{transform:translateY(0);}79.500%{transform:translateY(-80px);}79.600%{transform:translateY(80px);}85.000%{transform:translateY(80px);}92.000%{transform:translateY(0);}100.000%{transform:translateY(0);}}
.n0{animation-name:n0}
@keyframes u0{0.000%{transform:scaleX(1);}76.000%{transform:scaleX(1);}79.000%{transform:scaleX(0);}88.000%{transform:scaleX(0);}92.500%{transform:scaleX(1);}100.000%{transform:scaleX(1);}}
.u0{animation:u0 10s ease-out infinite;transform-box:fill-box;transform-origin:left center}
@keyframes n1{0.000%{transform:translateY(0);}76.800%{transform:translateY(0);}80.300%{transform:translateY(-80px);}80.400%{transform:translateY(80px);}86.200%{transform:translateY(80px);}93.200%{transform:translateY(0);}100.000%{transform:translateY(0);}}
.n1{animation-name:n1}
@keyframes u1{0.000%{transform:scaleX(1);}76.800%{transform:scaleX(1);}79.800%{transform:scaleX(0);}89.200%{transform:scaleX(0);}93.700%{transform:scaleX(1);}100.000%{transform:scaleX(1);}}
.u1{animation:u1 10s ease-out infinite;transform-box:fill-box;transform-origin:left center}
@keyframes n2{0.000%{transform:translateY(0);}77.600%{transform:translateY(0);}81.100%{transform:translateY(-80px);}81.200%{transform:translateY(80px);}87.400%{transform:translateY(80px);}94.400%{transform:translateY(0);}100.000%{transform:translateY(0);}}
