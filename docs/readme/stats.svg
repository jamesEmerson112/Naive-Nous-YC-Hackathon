@keyframes n3{0.000%{transform:translateY(0);}78.400%{transform:translateY(0);}81.900%{transform:translateY(-80px);}82.000%{transform:translateY(80px);}88.600%{transform:translateY(80px);}95.600%{transform:translateY(0);}100.000%{transform:translateY(0);}}
