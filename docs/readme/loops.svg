<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="tt dd">
<title id="tt">One heal loop, at three scales</title>
<desc id="dd">Three concentric loops around the Buddy chip. On the robot: detect, fix, verify, offline. Across the fleet: sync, replay, sim canary, promote. Across the company: work order, Naïve agent, technician and part, one human click.</desc>
