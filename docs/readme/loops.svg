1" fill="#FFFFFF" stroke="#2F8FD8" stroke-width="4"/><circle class="nd12 fb" cx="330.0" cy="474.0" r="11" fill="#2F8FD8"/><text x="330.0" y="510.0" class="t" font-size="17" font-weight="650" fill="#1F1B2E" text-anchor="middle" paint-order="stroke" stroke="#FFF8EE" stroke-width="6" stroke-linejoin="round">sim canary</text><circle cx="208.0" cy="352.0" r="11" fill="#FFFFFF" stroke="#2F8FD8" stroke-width="4"/><circle class="nd13 fb" cx="208.0" cy="352.0" r="11" fill="#2F8FD8"/><text x="186.0" y="358.0" class="t" font-size="17" font-weight="650" fill="#1F1B2E" text-anchor="end" paint-order="stroke" stroke="#FFF8EE" stroke-width="6" stroke-linejoin="round">promote</text><g transform="translate(330 352)"><g class="orb2"><circle cx="0.0" cy="-180.0" r="7.5" fill="#F7B23B" opacity="1.00"/><circle cx="-21.9" cy="-178.7" r="6.5" fill="#F7B23B" opacity="0.85"/><circle cx="-43.5" cy="-174.7" r="5.5" fill="#F7B23B" opacity="0.70"/><circle cx="-64.5" cy="-168.0" r="4.5" fill="#F7B23B" opacity="0.55"/><circle cx="-84.5" cy="-158.9" r="3.5" fill="#F7B23B" opacity="0.40"/><circle cx="-103.2" cy="-147.4" r="2.5" fill="#F7B23B" opacity="0.25"/></g></g><circle cx="445.7" cy="214.1" r="11" fill="#FFFFFF" stroke="#F7B23B" stroke-width="4"/><circle class="nd20 fb" cx="445.7" cy="214.1" r="11" fill="#F7B23B"/><text x="459.8" y="203.3" class="t" font-size="17" font-weight="650" fill="#1F1B2E" text-anchor="start" paint-order="stroke" stroke="#FFF8EE" stroke-width="6" stroke-linejoin="round">work order</text><circle cx="467.9" cy="467.7" r="11" fill="#FFFFFF" stroke="#F7B23B" stroke-width="4"/><circle class="nd21 fb" cx="467.9" cy="467.7" r="11" fill="#F7B23B"/><text x="484.7" y="487.8" class="t" font-size="17" font-weight="650" fill="#1F1B2E" text-anchor="start" paint-order="stroke" stroke="#FFF8EE" stroke-width="6" stroke-linejoin="round">Naïve agent</text><circle cx="214.3" cy="489.9" r="11" fill="#FFFFFF" stroke="#F7B23B" stroke-width="4"/><circle class="nd22 fb" cx="214.3" cy="489.9" r="11" fill="#F7B23B"/><text x="200.2" y="512.7" class="t" font-size="17" font-weight="650" fill="#1F1B2E" text-anchor="end" paint-order="stroke" stroke="#FFF8EE" stroke-width="6" stroke-linejoin="round">technician + part</text><circle cx="192.1" cy="236.3" r="11" fill="#FFFFFF" stroke="#F7B23B" stroke-width="4"/><circle class="nd23 fb" cx="192.1" cy="236.3" r="11" fill="#F7B23B"/><text x="175.3" y="228.2" class="t" font-size="17" font-weight="650" fill="#1F1B2E" text-anchor="end" paint-order="stroke" stroke="#FFF8EE" stroke-width="6" stroke-linejoin="round">1 human click</text><g class="hb"><g transform="translate(330 352) scale(0.6500)"><g class="lpb">
