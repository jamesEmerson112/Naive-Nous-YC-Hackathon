</g></g></g></g><g class="lg0"><rect x="606" y="120" width="556" height="140" rx="18" fill="#FFFFFF" stroke="#E8DECF" stroke-width="2"/><rect x="606" y="120" width="8" height="140" rx="4" fill="#6D5DF6"/><text x="634" y="150" class="t" font-size="13" font-weight="800" fill="#6D5DF6" text-anchor="start" letter-spacing="1.8">ON THE ROBOT</text><text x="634" y="178" class="r" font-size="21" font-weight="800" fill="#1F1B2E" text-anchor="start" >Heals itself, offline</text><text x="634" y="206" class="t" font-size="15.5" font-weight="500" fill="#6E6A7C" text-anchor="start" >A local model fixes software faults with no internet</text><text x="634" y="227" class="t" font-size="15.5" font-weight="500" fill="#6E6A7C" text-anchor="start" >and parks the arm when the fault is hardware. Every</text><text x="634" y="248" class="t" font-size="15.5" font-weight="500" fill="#6E6A7C" text-anchor="start" >flash is backed up, verified and rolled back if bad.</text></g><g class="lg1"><rect x="606" y="268" width="556" height="140" rx="18" fill="#FFFFFF" stroke="#E8DECF" stroke-width="2"/><rect x="606" y="268" width="8" height="140" rx="4" fill="#2F8FD8"/><text x="634" y="298" class="t" font-size="13" font-weight="800" fill="#2F8FD8" text-anchor="start" letter-spacing="1.8">ACROSS THE FLEET</text><text x="634" y="326" class="r" font-size="21" font-weight="800" fill="#1F1B2E" text-anchor="start" >What one robot learns, every robot gets</text><text x="634" y="354" class="t" font-size="15.5" font-weight="500" fill="#6E6A7C" text-anchor="start" >Back online, each robot syncs to the Romulus cloud.</text><text x="634" y="375" class="t" font-size="15.5" font-weight="500" fill="#6E6A7C" text-anchor="start" >A fix that holds is replayed against past incidents,</text><text x="634" y="396" class="t" font-size="15.5" font-weight="500" fill="#6E6A7C" text-anchor="start" >tried on a simulated canary, then shipped to all.</text></g><g class="lg2"><rect x="606" y="416" width="556" height="140" rx="18" fill="#FFFFFF" stroke="#E8DECF" stroke-width="2"/><rect x="606" y="416" width="8" height="140" rx="4" fill="#F7B23B"/><text x="634" y="446" class="t" font-size="13" font-weight="800" fill="#B9770E" text-anchor="start" letter-spacing="1.8">ACROSS THE COMPANY</text><text x="634" y="474" class="r" font-size="21" font-weight="800" fill="#1F1B2E" text-anchor="start" >Naïve agents take what needs hands</text><text x="634" y="502" class="t" font-size="15.5" font-weight="500" fill="#6E6A7C" text-anchor="start" >A hardware fault becomes a work order. A Naïve agent</text><text x="634" y="523" class="t" font-size="15.5" font-weight="500" fill="#6E6A7C" text-anchor="start" >diagnoses it, emails a technician and stages the part.</text><text x="634" y="544" class="t" font-size="15.5" font-weight="500" fill="#6E6A7C" text-anchor="start" >A person clicks once, only to spend money.</text></g>
</svg>
