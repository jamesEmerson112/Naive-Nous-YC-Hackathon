[project]
name = "romulus-contracts"
version = "0.1.0"
description = "Shared contracts between Romulus devices and the cloud platform (APIs doc §2)."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/romulus_contracts"]
