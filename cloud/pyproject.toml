[project]
name = "romulus-cloud"
version = "0.1.0"
description = "Romulus cloud platform: device API, registry, batch, gate, telemetry, timeline."
requires-python = ">=3.12"
dependencies = [
    "romulus-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "openai>=1.54",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/romulus_cloud"]
