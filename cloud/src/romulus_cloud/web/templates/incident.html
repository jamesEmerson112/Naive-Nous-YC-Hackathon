{% extends "base.html" %}
{% from "partials/ui.html" import icon %}
{% block title %}Romulus · {{ story.incident.device_id }} · {{ story.incident.kind | kindword }}{% endblock %}
{% block content %}
<p class="back"><a href="/">{{ icon("chevron") }}All incidents</a></p>
<div id="story" hx-get="/partials/incidents/{{ story.incident.incident_id }}" hx-trigger="every 3s [document.visibilityState === 'visible']" hx-swap="innerHTML">
  {% include "partials/story.html" %}
</div>
{% endblock %}
