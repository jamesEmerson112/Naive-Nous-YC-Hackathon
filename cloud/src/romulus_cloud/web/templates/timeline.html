{% extends "base.html" %}
{% block title %}Romulus · timeline{% endblock %}
{% block content %}
<section aria-labelledby="fleet-h">
  <h2 id="fleet-h" class="section-h">Fleet</h2>
  <div id="fleet" hx-get="/partials/fleet" hx-trigger="every 3s [document.visibilityState === 'visible']" hx-swap="innerHTML">
    {% include "partials/fleet.html" %}
  </div>
</section>
<section aria-labelledby="inc-h">
  <h1 id="inc-h" class="section-h">Incidents <span class="muted">newest first</span></h1>
  <div id="incidents" hx-get="/partials/incidents" hx-trigger="every 3s [document.visibilityState === 'visible']" hx-swap="innerHTML">
    {% include "partials/incidents.html" %}
  </div>
</section>
{% endblock %}
